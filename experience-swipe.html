<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vietnam Experience Curator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--ink:#f8f4ec;--deep:#0b2422;--panel:#102b2bcc;--green:#68c27c;--red:#ef5662;--blue:#5ea6ff;--gold:#f1c86b}*{box-sizing:border-box}body{margin:0;background:#071816;color:var(--ink);font-family:Inter,sans-serif;min-height:100vh;background-image:linear-gradient(#07181699,#071816e8),url('https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1800&q=82');background-size:cover;background-position:center;background-attachment:fixed}.app{max-width:1180px;margin:auto;padding:18px 14px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{font:800 20px Manrope}.brand small{display:block;font:700 8px Inter;letter-spacing:.22em;opacity:.7;margin-top:3px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff33;border-radius:999px;padding:9px 12px;font-size:12px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:16px}.panel{background:var(--panel);border:1px solid #ffffff1d;border-radius:18px;backdrop-filter:blur(13px);padding:13px}.destinations{max-height:78vh;overflow:auto}.dest{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:11px;border-radius:13px;margin:2px 0;font-weight:700}.dest.active{background:#285654}.dest small{display:block;opacity:.6;font-weight:400;margin-top:3px}.stage{min-width:0}.stack{position:relative;height:min(68vh,690px);min-height:520px}.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#17332f;box-shadow:0 22px 70px #0008;touch-action:none;user-select:none;transition:transform .22s ease,opacity .22s ease}.card.behind{transform:scale(.965) translateY(-9px);opacity:.55}.photo{position:absolute;inset:0;background-size:cover;background-position:center}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#00000008 30%,#000000e8 84%,#000 100%)}.copy{position:absolute;left:20px;right:20px;bottom:18px}.place{display:inline-block;background:#102a28dd;border:1px solid #ffffff3b;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.count{float:right}.copy h1{font:800 clamp(27px,5vw,42px)/.98 Manrope;margin:12px 0 8px}.copy p{font-size:14px;line-height:1.45;margin:0 0 10px;max-width:720px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;font-weight:800;border:1px solid #ffffff55;border-radius:999px;padding:5px 8px;background:#0005}.facts{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:11px;opacity:.9}.actions{display:flex;justify-content:center;align-items:center;gap:20px;padding:15px}.circle{width:64px;height:64px;border-radius:50%;border:0;background:#fff;font-size:27px;font-weight:800}.no{color:var(--red)}.yes{color:var(--green)}.info{color:var(--blue);width:48px;height:48px;font-size:19px}.side h3{margin:5px 0 10px;font:800 18px Manrope}.meter{height:8px;background:#ffffff25;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green)}.selected{margin-top:15px;max-height:45vh;overflow:auto}.pick{font-size:11px;padding:8px 0;border-bottom:1px solid #ffffff17}.hint{font-size:11px;line-height:1.5;opacity:.65}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#102724;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){.layout{grid-template-columns:1fr}.destinations,.side{display:none}.app{padding:10px 10px 20px}.top{margin-bottom:8px}.stack{height:68vh;min-height:500px}.copy{left:17px;right:17px}.actions{padding:13px 0 4px}.circle{width:62px;height:62px}.info{width:48px;height:48px}.brand{font-size:17px}}</style></head><body><div class="app"><header class="top"><div class="brand">Travel Companion<small>EXPLORE · EXPERIENCE · REMEMBER</small></div><a class="back" href="./">← Main app</a></header><main class="layout"><aside class="panel destinations"><h3>Vietnam destinations</h3><div id="destList"></div></aside><section class="stage"><div class="stack" id="stack"></div><div class="actions"><button class="circle no" onclick="vote('out')">×</button><button class="circle info" onclick="more()">i</button><button class="circle yes" onclick="vote('in')">♥</button></div></section><aside class="panel side"><h3 id="sideTitle">Ho Chi Minh City</h3><div class="meter"><i id="meter" style="width:0%"></i></div><p class="hint" id="counter"></p><h3>Your selections</h3><div class="selected" id="selected"></div><p class="hint">Swipe right to include. Swipe left to exclude. Your decisions are saved on this device so we can use the approved list when rebuilding V0.21.</p></aside></main></div><div class="toast" id="toast"></div><script>
const destinations=['Ho Chi Minh City','Cái Bè / Tân Phong','Sa Đéc','Cần Thơ','Châu Đốc','Hà Tiên','Phú Quốc','Côn Đảo','Vũng Tàu','Đà Lạt','Đắk Lắk / Buôn Ma Thuột','Buôn Đôn / Yok Đôn','Lak Lake','Kon Tum','Pleiku','Măng Đen','Quy Nhơn','Phú Yên','Nha Trang','Hội An','Đà Nẵng','Hải Vân Pass','Huế','Bạch Mã','Phong Nha','Ninh Bình','Pù Luông','Hà Nội','Hạ Long / Cát Bà','Hà Giang Loop','Cao Bằng','Mù Cang Chải'];
const base={
'Ho Chi Minh City':[
['Street Food Exploration','Eat through Saigon’s street-food scene: bánh mì, cơm tấm, late-night snails and neighbourhood alley stalls.','Food & Drink,Local Life,Must Do','Flexible','A$5–15','https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=1200&q=85'],
['Saigon Coffee Culture','Follow the city’s coffee story from traditional phin brewing to old apartment cafés and modern specialty shops.','Coffee,Local Life,Passport','2–4 hr','A$3–15','https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=85'],
['Chợ Lớn Deep Dive','Explore Bình Tây Market, Chinese-Vietnamese temples, trading streets, food and the layered history of Saigon’s Chinatown.','Culture,Local Life,Markets','Half day','A$5–20','https://images.unsplash.com/photo-1555921015-5532091f6026?auto=format&fit=crop&w=1200&q=85'],
['Neighbourhood Alley Wander','Leave the central tourist corridor and explore residential hẻm, local markets, cafés and everyday Saigon life.','Hidden,Local Life,Free/Cheap','2–3 hr','Free–A$10','https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1200&q=85'],
['Hồ Thị Kỷ After Dark','See the flower market shift into a dense evening street-food zone and sample your way through the lanes.','Food,Night,Markets','2–3 hr','A$10–25','https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=1200&q=85'],
['Saigon Ranger Bunker','Step inside an unassuming wartime hideout associated with the Saigon-Gia Định commandos and hear its clandestine history.','Unique,History,Hidden','1–2 hr','Low cost','https://images.unsplash.com/photo-1565073624497-7144969d0a07?auto=format&fit=crop&w=1200&q=85'],
['42 Nguyễn Huệ Apartment Crawl','Explore the famous old apartment block stacked with cafés, balconies and small businesses above the walking street.','Coffee,Views,Local Life','1–2 hr','A$5–15','https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=1200&q=85'],
['District 4 Food Crawl','Cross the river for seafood, snails, grills and tightly packed neighbourhood food streets.','Food,Local Life,Night','2–3 hr','A$10–30','https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=1200&q=85'],
['War Remnants Museum','A confronting museum presenting the wars in Vietnam through photographs, artefacts and Vietnamese perspectives.','Must Do,History','2–3 hr','Low cost','https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=1200&q=85'],
['Củ Chi Tunnels','Travel outside central Saigon to explore the tunnel network and learn how underground systems were used during wartime.','History,Day Trip','Half/full day','Tour cost varies','https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1200&q=85']]
};
const fallbackPhotos=['https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?auto=format&fit=crop&w=1200&q=85'];
function cardsFor(d){if(base[d])return base[d];return [[`Best of ${d}`,`Placeholder curation card for ${d}. This temporary curator is ready for the destination-specific master-itinerary experiences and researched discoveries we approve together.`,'Master,To Curate','Flexible','Budget travel',fallbackPhotos[destinations.indexOf(d)%fallbackPhotos.length]]];}
let dest=localStorage.swipeDest||destinations[0],idx=0;const decisions=JSON.parse(localStorage.vietnamExperienceVotes||'{}');function renderDest(){destList.innerHTML=destinations.map(d=>`<button class="dest ${d===dest?'active':''}" onclick="setDest(${JSON.stringify(d)})">${d}<small>${cardsFor(d).length} cards ready</small></button>`).join('')};function setDest(d){dest=d;idx=0;localStorage.swipeDest=d;renderDest();render()};function render(){const arr=cardsFor(dest);if(idx>=arr.length){stack.innerHTML=`<div class="card"><div class="photo" style="background-image:url('${fallbackPhotos[0]}')"></div><div class="shade"></div><div class="copy"><span class="place">✓ ${dest}</span><h1>Destination reviewed</h1><p>You’ve reached the end of the current cards for this destination.</p><button onclick="nextDest()" style="padding:12px;border:0;border-radius:12px;font-weight:800">Next destination →</button></div></div>`}else{const c=arr[idx];stack.innerHTML=`<article class="card" id="activeCard"><div class="photo" style="background-image:url('${c[5]}')"></div><div class="shade"></div><div class="copy"><span class="place">⌖ ${dest}</span><span class="place count">♥ ${idx+1} / ${arr.length}</span><h1>${c[0]}</h1><div class="tags">${c[2].split(',').map(t=>`<span class="tag">${t}</span>`).join('')}</div><p>${c[1]}</p><div class="facts"><span>◷ ${c[3]}</span><span>◉ ${c[4]}</span><span>♙ Solo friendly</span></div></div></article>`;drag()};sideTitle.textContent=dest;counter.textContent=`${Math.min(idx,arr.length)} / ${arr.length} reviewed`;meter.style.width=(Math.min(idx,arr.length)/arr.length*100)+'%';renderSelected()};function vote(v){const arr=cardsFor(dest);if(idx>=arr.length)return;const c=arr[idx];decisions[dest+'|'+c[0]]=v;localStorage.vietnamExperienceVotes=JSON.stringify(decisions);const el=document.getElementById('activeCard');if(el){el.style.transform=`translateX(${v==='in'?120:-120}%) rotate(${v==='in'?12:-12}deg)`;el.style.opacity=0}toast.textContent=v==='in'?'♥ INCLUDED':'× NOT FOR ME';toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');idx++;render()},180)}function more(){const arr=cardsFor(dest);if(idx>=arr.length)return;alert(arr[idx][0]+'\n\n'+arr[idx][1]+'\n\n'+arr[idx][2]+' · '+arr[idx][3]+' · '+arr[idx][4])}function renderSelected(){const picks=Object.entries(decisions).filter(([k,v])=>v==='in'&&k.startsWith(dest+'|')).map(([k])=>k.split('|')[1]);selected.innerHTML=picks.length?picks.map(x=>`<div class="pick">♥ ${x}</div>`).join(''):'<p class="hint">Nothing selected yet.</p>'}function nextDest(){const n=(destinations.indexOf(dest)+1)%destinations.length;setDest(destinations[n])}function drag(){const el=document.getElementById('activeCard');if(!el)return;let start=0,dx=0;el.onpointerdown=e=>{start=e.clientX;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!start)return;dx=e.clientX-start;el.style.transition='none';el.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`};el.onpointerup=()=>{el.style.transition='transform .22s ease,opacity .22s ease';if(Math.abs(dx)>90){vote(dx>0?'in':'out')}else el.style.transform='';start=0;dx=0}}renderDest();render();</script></body></html>

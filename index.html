}

const photoCache={};
async function wikiPhoto(title){
 if(photoCache[title]!==undefined)return photoCache[title];
 try{
  const u="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title);
  const r=await fetch(u); if(!r.ok)throw new Error("photo");
  const j=await r.json(); const url=j.originalimage?.source||j.thumbnail?.source||"";
  photoCache[title]=url; return url;
 }catch(e){photoCache[title]="";return ""}
}
async function hydrateDestinationPhotos(id){
 const cards=[...document.querySelectorAll(".photoDest")],titles=DEST_WIKI[id]||[];
 cards.forEach(async(card,i)=>{
  const title=titles[i]||card.dataset.title;
  const url=await wikiPhoto(title);
  if(url){card.style.setProperty("background-image",`url("${url}")`,"important");card.classList.remove("loadingPhoto")}
 });
}

async function specificHcmImage(id){
 if(hcmImageCache[id]!==undefined)return hcmImageCache[id];
 const q=HCMC_IMAGE_QUERIES[id]||HCMC30.find(x=>x.id===id)?.title||"";
 try{
  const u='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=1&prop=pageimages&piprop=original|thumbnail&pithumbsize=900&format=json&origin=*';

 }catch(e){hcmImageCache[id]='';return ''}

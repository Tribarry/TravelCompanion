 background:

.cover{background:#0a2723!important;overflow:hidden}

ney through the cajuput wetland and bird habitat.","booking":"No","content":"Very high"},{"name":"Khmer villages around Tri Ton / Tinh Bien","tier":"S","type":"culture","summary":"Explore the Khmer cultural landscape of An Giang respectfully.","booking":"No","content":"High"},{"name":"Ghositaram Temple","tier":"S","type":"culture","summary":"Visit the ornate Khmer Buddhist complex at Bac Lieu.","booking":"No","content":"Very high"},{"name":"Sa Dec flower village","tier":"A","type":"local","summary":"Flower-growing community, market life and quieter Delta streets.","booking":"No","content":"High"},{"name":"Village cycling","tier":"A","type":"active","summary":"Use bicycles to connect small roads, orchards and ferry crossings.","booking":"No","content":"High"}]},{"name":"Con Dao","stay":"3-4","experiences":[{"name":"Con Dao prison history","tier":"S","type":"history","summary":"Understand the island through its prison and revolutionary history.","booking":"No","content":"High"},{"name":"National park and quiet beaches","tier":"A","type":"nature","summary":"Slow island days combining forest and coastline.","booking":"No","content":"High"}]},{"name":"Central Highlands","stay":"12-16","experiences":[{"name":"Da Lat canyoning","tier":"S+","type":"adventure","summary":"Guided canyoning through waterfalls and rock sections.","booking":"Book operator","content":"Very high"},{"name":"Yok Don ethical elephant tracking","tier":"S+","type":"wildlife","summary":"Forest-based elephant observation focused on natural behaviour rather than riding.","booking":"Book ahead","content":"Very high"},{"name":"Buon Ma Thuot coffee culture","tier":"S","type":"food","summary":"Coffee farms, roasting and the Central Highlands coffee identity.","booking":"No","content":"High"},{"name":"Bahnar village stay near Kon Tum","tier":"S","type":"local","summary":"Community architecture, communal houses and local-life experience.","booking":"Arrange locally","content":"High"},{"name":"Mang Den highland s to understand the city's street-level culture.","booking":"No","content":"High"},{"name":"Egg coffee and cafe culture","tier":"A","type":"food","summary":"A Hanoi-specific cafe experience and useful editing/reset time.","booking":"No","content":"High"},{"name":"Markets and neighbourhood wandering","tier":"A","type":"local","summary":"Unstructured local exploration rather than attraction hopping.","booking":"No","content":"High"}]},{"name":"Lan Ha Bay / Cat Ba","stay":"4-6","experiences":[{"name":"Lan Ha kayaking","tier":"S","type":"nature","summary":"Paddle limestone islands and sheltered water.","booking":"Book weather-dependent","content":"Very high"},{"name":"Cat Ba National Park hike","tier":"A","type":"active","summary":"Forest hiking and island viewpoints.","booking":"No","content":"High"},{"name":"Fishing-village / island cycling","tier":"A","type":"local","summary":"Slower island movement and local coastal life.","booking":"No","content":"High"}]},{"name":"Northern Vietnam","stay":"16-22","experiences":[{"name":"Ba Be village homestay and lake","tier":"S","type":"local","summary":"Lake, boat, village stay and mountain landscape.","booking":"No","content":"High"},{"name":"Ban Gioc waterfall","tier":"S+","type":"landscape","summary":"Major border waterfall and one of the strongest visual stops in Cao Bang.","booking":"No","content":"Very high"},{"name":"God's Eye Mountain","tier":"S","type":"landscape","summary":"Distinctive karst sinkhole landscape near Cao Bang.","booking":"Weather matters","content":"Very high"},{"name":"Ha Giang Loop Easy Rider","tier":"S+","type":"road","summary":"Multi-day mountain road journey through Dong Van, Meo Vac, Ma Pi Leng and Du Gia.","booking":"Book reputable rider","content":"Very high"},{"name":"Hoang Su Phi village trekking","tier":"S","type":"local","summary":"Terraces, Red Dao communities and homestay trekking.","booking":"No","content":"High"},{"name":"Mu Cang Chai terraces","tier":"A","type":"landscape","summary":"Terraced mountain scenery and village routes.","booking":"No","content":"High"},{"name":"Y Ty / Ha Nhi villages","tier":"A","type":"local","summary":"Remote highland villages and cloud landscapes.","booking":"No","content":"High"},{"name":"Bac Ha Sunday market","tier":"S","type":"market","summary":"Large ethnic-minority market best timed for Sunday.","booking":"Date-dependent","content":"Very high"},{"name":"Sa Pa selective stop","tier":"B","type":"landscape","summary":"Only retain if it adds something not already covered by the stronger northern mountain route.","booking":"No","content":"High"}]}],"laos":[{"name":"Northern Laos entry corridor","stay":"2-3","experiences":[{"name":"Overland mountain transition from Vietnam","tier":"S","type":"journey","summary":"Treat the border-to-northern-Laos journey as part of the experience, with routing dependent on the border/visa method ultimately chosen.","booking":"Verify border before travel","content":"High"}]},{"name":"Nong Khiaw / Muang Ngoi","stay":"5-6","experiences":[{"name":"Nong Khiaw viewpoint","tier":"S","type":"active","summary":"Climb above the Nam Ou karst valley for one of northern Laos's signature views.","booking":"Weather matters","content":"Very high"},{"name":"Overnight village / mountain trek","tier":"S+","type":"local","summary":"Guided trek with a village component rather than a simple day hike.","booking":"Book locally","content":"Very high"},{"name":"Muang Ngoi boat-in slow stay","tier":"S","type":"slow","summary":"A deliberate low-speed village stay reached by river.","booking":"No","content":"High"}]},{"name":"Nam Et-Phou Louey","stay":"2-3","experiences":[{"name":"Conservation wildlife night experience","tier":"S+","type":"wildlife","summary":"Community-linked protected-area experience focused on forest conservation and nocturnal wildlife.","booking":"Advance booking","content":"Very high"}]},{"name":"Luang Prabang","stay":"4","experiences":[{"name":"Kuang Si Waterfall","tier":"S","type":"nature","sum function dontMiss(){const p=allExp().filter(r=>!state.done[r.id]&&!state.skip[r.id]&&(r.e.tier==="S+"||r.e.tier==="S"));app.innerHTML=head("DON'T MISS")+'<section class="hero"><div class="kicker">FOMO CONTROL</div><h1>'+p.length+' major experiences remain</h1></section><h3>Fixed commitments</h3>'+DATA.constraints.map(x=>'<div class="card warn"><b>'+x.label+'</b><div class="meta">'+x.date+'</div></div>').join("")+'<h3>Priority experiences</h3>'+p.map(r=>'<div class="card"><span class="badge '+(r.e.tier==="S+"?"splus":"")+'">'+r.e.tier+'</span><span class="badge type">'+r.e.type+'</span><h2>'+r.e.name+'</h2><div class="meta">'+r.c.name+" / "+r.d.name+'</div><p>'+r.e.summary+'</p></div>').join("")}
function journey(){app.innerHTML=head("MY JOURNEY")+'<section class="hero"><div class="kicker">EXPERIENCE PASSPORT</div><h1>Country chapters</h1><p>Destinations are containers. Experiences are what you are actually collecting.</p></section>'+DATA.countries.map(c=>{const d=DATA.destinations[c.id],ids=allExp().filter(r=>r.c.id===c.id),n=ids.filter(r=>state.done[r.id]).length;return '<div class="card"><h2>'+c.name+'</h2><div class="meta">'+n+" / "+ids.length+" experiences complete / "+d.length+' destination clusters</div><button class="btn wide country" data-id="'+c.id+'">Open country</button></div>'}).join("");document.querySelectorAll(".country").forEach(b=>b.onclick=()=>country(b.dataset.id))}
function country(id){const c=DATA.countries.find(x=>x.id===id);app.innerHTML=head(c.name)+'<section class="hero"><div class="kicker">'+c.code+'</div><h1>'+c.name+'</h1><p>'+c.subtitle+'</p></section>'+DATA.destinations[id].map((d,i)=>'<div class="card"><h2>'+(i+1)+". "+d.name+'</h2><div class="meta">'+d.stay+" days/nights / "+d.experiences.length+' experiences</div>'+d.experiences.map(e=>'<p><span class="badge '+(e.tier==="S+"?"splus":"")+'">'+e.tier+'</span> '+e.name+'</p>').join("")+'<button class="btn open" data-i="'+i+'">Open destination</button></div>').join("")+'<button class="btn wide" id="bj">Back</button>';document.querySelectorAll(".open").forEach(b=>b.onclick=function(){state.here=id+":"+b.dataset.i;save();doHere()});bj.onclick=journey}
function setLocation(){let o='<option value="pre">Pre-departure / Melbourne</option>';DATA.countries.forEach(c=>DATA.destinations[c.id].forEach((d,i)=>{const v=c.id+":"+i;o+='<option value="'+v+'" '+(state.here===v?"selected":"")+'>'+c.name+" / "+d.name+"</option>"}));app.innerHTML=head("SET LOCATION")+'<div class="card"><select id="where">'+o+'</select><button class="btn primary wide" id="set">UPDATE LOCATION</button><button class="btn wide" id="cancel">Cancel</button></div>';set.onclick=function(){state.here=where.value;save();home()};cancel.onclick=home}
document.querySelectorAll("nav button").forEach(b=>b.onclick=function(){const p=b.dataset.page;if(p==="home")home();else if(p==="do")doHere();else if(p==="next")goNext();else if(p==="miss")dontMiss();else journey()});try{landing()}catch(err){app.innerHTML='<div class="card warn"><h2>App error</h2><p>'+String(err.message||err)+'</p></div>'}</script></body></html>

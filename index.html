const app=document.getElementById('app');
const nav=document.getElementById('nav');
let state;
try {
 state=JSON.parse(localStorage.getItem('sea2027-simple-v1')||'{"here":"Pre-departure · Melbourne","done":{},"content":{}}');
} catch(e) {
 state={here:"Pre-departure · Melbourne",done:{},content:{}};
}
let history=[];
const save=()=>localStorage.setItem('sea2027-simple-v1',JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function shell(title,body,showBack=true){
 app.innerHTML=`<header class="top">${showBack?'<button class="back" id="backButton">← Back</button>':''}<b>${esc(title)}</b></header>${body}`;
 if(showBack) document.getElementById('backButton').onclick=goBack;
 window.scrollTo(0,0);
}
function push(fn,args=[]){history.push({fn,args})}
function goBack(){const h=history.pop(); h?h.fn(...h.args):now(false)}
function countryByName(n){return DATA.countries.find(c=>c.name===n)}
function parseHere(){
 const p=state.here.split(' · ');
 if(p.length<2)return null;
 const c=countryByName(p[0]); if(!c)return null;
 const name=p.slice(1).join(' · ');
 const i=DATA.stops[c.id].findIndex(s=>s[0]===name);
 return i<0?null:{c,i,s:DATA.stops[c.id][i]};
}
function eid(c,i){return c.id+'-'+i}
function isDone(c,i){return !!state.done[eid(c,i)]}
function allRows(){return DATA.countries.flatMap(c=>DATA.stops[c.id].map((s,i)=>({c,s,i,id:eid(c,i)})))}
function nextUndone(){
 const rows=allRows(),h=parseHere();
 if(!h)return rows.find(r=>!state.done[r.id]);
 const pos=rows.findIndex(r=>r.c.id===h.c.id&&r.i===h.i);
 return rows.slice(pos+1).find(r=>!state.done[r.id])||rows.find(r=>!state.done[r.id]);
}
function now(record=true){
 if(record)push(now,[false]);
 const h=parseHere(),rows=allRows(),done=rows.filter(r=>state.done[r.id]).length,next=nextUndone();
 const pct=Math.round(done/rows.length*100);
 const context=h?`${h.c.flag} ${h.c.name} · ${h.s[0]}`:'Melbourne · pre-departure';
 shell('YOU ARE HERE',`
 <div class="hero fallback dashboardHero"><div class="heroText"><div class="kicker">Current position</div><h2>${esc(context)}</h2><p>${h?'What matters here, then the smartest next move.':'Departure 28 January 2027. Your master itinerary is loaded.'}</p></div></div>
 <div class="actionGrid">
 <button class="action" id="doBtn"><span class="icon">✓</span><strong>DO HERE</strong><small>${h?esc(h.s[1]):'See first experience'}</small></button>
 <button class="action" id="nextBtn"><span class="icon">→</span><strong>GO NEXT</strong><small>${next?esc(next.s[0]):'Route complete'}</small></button>
 <button class="action" id="missBtn"><span class="icon">!</span><strong>DON'T MISS</strong><small>High-priority + fixed dates</small></button>

 </div>
 <h3>Journey progress</h3><div class="card"><b>${pct}% complete</b><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>
 <button class="btn" id="locationBtn" style="width:100%">Change “You are here”</button>`,false);
 document.getElementById('doBtn').onclick=doHere;
 document.getElementById('nextBtn').onclick=goNext;
 document.getElementById('missBtn').onclick=dontMiss;
 document.getElementById('journeyBtn').onclick=journey;
 document.getElementById('locationBtn').onclick=setLocation;
}
function doHere(){
 const h=parseHere();
 if(h)return experience(h.c,h.i,'DO HERE');

}
function experience(c,i,title='EXPERIENCE'){
 push(now,[false]); const s=DATA.stops[c.id][i],done=isDone(c,i),content=!!state.content[eid(c,i)];
 shell(title,`<div class="hero fallback"><div class="heroText"><div class="kicker">${c.flag} ${esc(c.name)} · ${s[3]} priority</div><h2>${esc(s[0])}</h2><p>${esc(s[1])} nights/days</p></div></div>
 <div class="card"><span class="badge ${s[3]==='S+'?'splus':''}">${s[3]}</span><h3 style="margin-top:10px">${esc(s[1])}</h3><p>${esc(s[2])}</p><div class="social"><b>Content mode</b><br>Wide establishing shot → human/detail → movement/reveal → one spoken observation.</div></div>
 <button class="btn primary completeBtn" id="doneBtn">${done?'✓ COMPLETED':'MARK EXPERIENCE COMPLETE'}</button>
 <button class="btn completeBtn" id="contentBtn">${content?'✓ FOOTAGE CAPTURED':'MARK FOOTAGE CAPTURED'}</button>`);
 document.getElementById('doneBtn').onclick=()=>{state.done[eid(c,i)]=!done;save();history.pop();experience(c,i,title)};
 document.getElementById('contentBtn').onclick=()=>{state.content[eid(c,i)]=!content;save();history.pop();experience(c,i,title)};
}
function goNext(){
 push(now,[false]); const r=nextUndone();
 if(!r)return shell('GO NEXT','<div class="notice">Everything is complete.</div>');
 shell('GO NEXT',`<div class="card decision"><div class="sectionLabel">Recommended next</div><h2>${r.c.flag} ${esc(r.s[0])}</h2><p><b>${esc(r.s[1])}</b></p><p>${esc(r.s[2])}</p><div class="why"><div><b>Priority</b><br>${r.s[3]}</div><div><b>Sequence</b><br>Next unfinished stop</div></div></div><button class="btn primary" id="hereNow" style="width:100%">I'M HERE NOW →</button>`);
 document.getElementById('hereNow').onclick=()=>{state.here=r.c.name+' · '+r.s[0];save();history=[];now(false)};
}
function dontMiss(){
 push(now,[false]); const p=allRows().filter(r=>!state.done[r.id]&&(r.s[3]==='S+'||r.s[3]==='S'));
 shell("DON'T MISS",`<div class="hero fallback"><div class="heroText"><div class="kicker">FOMO CONTROL</div><h2>${p.length} major experiences remain</h2></div></div>
 <h3>Fixed commitments</h3>${(DATA.constraints||[]).map(x=>`<div class="card locked"><b>${esc(x.label)}</b><div class="meta">${esc(x.date||((x.start||'')+' → '+(x.end||'')))}</div></div>`).join('')}
 <h3>High-priority experiences</h3>${p.map(r=>`<div class="card"><span class="badge ${r.s[3]==='S+'?'splus':''}">${r.s[3]}</span><b style="display:block;margin-top:7px">${esc(r.s[0])}</b><div class="meta">${r.c.flag} ${esc(r.c.name)}</div><p>${esc(r.s[1])} — ${esc(r.s[2])}</p></div>`).join('')}`);
}
function journey(){
 push(now,[false]);
 shell('MY JOURNEY',`<div class="hero fallback"><div class="heroText"><div class="kicker">Experience passport</div><h2>Your journey</h2><p>Open a country to see the complete sequence.</p></div></div>${DATA.countries.map(c=>{const a=DATA.stops[c.id],d=a.filter((s,i)=>isDone(c,i)).length,p=Math.round(d/a.length*100);return `<div class="card"><b>${c.flag} ${esc(c.name)}</b><div class="meta">${d}/${a.length} completed · ${p}%</div><button class="btn countryBtn" data-id="${c.id}" style="margin-top:10px">Open country →</button></div>`}).join('')}`);
 document.querySelectorAll('.countryBtn').forEach(b=>b.onclick=()=>country(b.dataset.id));
}
function country(id){
 const c=DATA.countries.find(x=>x.id===id); push(journey);
 shell(c.flag+' '+c.name,`<div class="hero fallback"><div class="heroText"><div class="kicker">Country chapter</div><h2>${c.flag} ${esc(c.name)}</h2><p>${esc(c.subtitle)}</p></div></div><div class="chips">${c.key.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><h3>Travel sequence</h3>${DATA.stops[id].map((s,i)=>`<div class="card ${isDone(c,i)?'done':''}"><span class="badge ${s[3]==='S+'?'splus':''}">${s[3]}</span><b style="display:block;margin-top:6px">${i+1}. ${esc(s[0])}</b><div class="meta">${esc(s[1])} nights/days</div><p>${esc(s[2])}</p><button class="btn expBtn" data-i="${i}">Open →</button></div>`).join('')}`);
 document.querySelectorAll('.expBtn').forEach(b=>b.onclick=()=>experience(c,+b.dataset.i,c.name.toUpperCase()));
}
function setLocation(){
 push(now,[false]); const opts=['Pre-departure · Melbourne',...DATA.countries.flatMap(c=>DATA.stops[c.id].map(s=>c.name+' · '+s[0]))];
 shell('SET LOCATION',`<div class="card"><select id="loc">${opts.map(x=>`<option ${x===state.here?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn primary" id="set" style="width:100%;margin-top:10px">UPDATE LOCATION</button></div>`);
 document.getElementById('set').onclick=()=>{state.here=document.getElementById('loc').value;save();history=[];now(false)};
}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>({now:()=>now(false),do:doHere,next:goNext,miss:dontMiss,journey}[b.dataset.nav])());
try {
 nav.hidden=false;
 now(false);
} catch(err) {
 console.error(err);
 app.innerHTML=`<div class="errorbox"><h2>App error</h2><p>${esc(err.message||err)}</p></div>`;
}
</script>
</body></html>

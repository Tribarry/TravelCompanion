const photoCache={};
async function wikiPhoto(title){
 if(photoCache[title]!==undefined)return photoCache[title];
 try{
  const u="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title);
  const r=await fetch(u); if(!r.ok)throw new Error("photo");
  const j=await r.json(); const url=j.originalimage?.source||j.thumbnail?.source||"";
  photoCache[title]=url; return url;
 }catch(e){photoCache[title]="";return ""}
}
async function hydrateDestinationPhotos(id){
 const cards=[...document.querySelectorAll(".photoDest")],titles=DEST_WIKI[id]||[];
 cards.forEach(async(card,i)=>{
  const title=titles[i]||card.dataset.title;
  const url=await wikiPhoto(title);
  if(url){card.style.setProperty("background-image",`url("${url}")`,"important");card.classList.remove("loadingPhoto")}
 });
}
function destinationSelector(id){
 const c=DATA.countries.find(x=>x.id===id);
 app.innerHTML=`<section class="selector"><div class="selectorInner">

   <h1>Where in ${c.name}?</h1>
   <p class="selectorLead">Choose your current district, town or travel area. Experiences and nearby side trips are grouped under the most useful base.</p>
   ${DATA.destinations[id].map((d,i)=>`<button class="destinationPick photoDest loadingPhoto" data-i="${i}" data-title="${d.name}">
      <span class="destShade"></span><span class="destCopy"><b>${d.name}</b><small>${d.stay} days/nights · ${d.experiences.length} experiences</small></span><span class="destArrow">→</span>
   </button>`).join("")}
 </div></section>`;
 document.getElementById("countryBack").onclick=countrySelector;
 document.querySelectorAll(".destinationPick").forEach(b=>b.onclick=function(){
   state.here=id+":"+b.dataset.i;save();document.querySelector("nav").style.display="grid";home();
 });

}
function home(){
 const x=cur(),ex=allExp(),done=ex.filter(r=>state.done[r.id]).length,n=nextDest(),pct=Math.round(done/ex.length*100);
 const place=x?(x.c.name+" / "+x.d.name):"Melbourne / pre-departure";
 const remain=x?x.d.experiences.filter((e,j)=>!state.done[x.id+"-"+j]&&!state.skip[x.id+"-"+j]).length+" experiences remain here.":"Your experience-first master journey is loaded.";
 app.innerHTML=head("YOU ARE HERE")+`
 <section class="hero"><div class="kicker">CURRENT POSITION</div><h1>${place}</h1><p>${remain}</p></section>
 <div class="grid">
 <button class="action" id="aDo"><b>DO HERE</b><small>Experiences at this destination</small></button>
 <button class="action" id="aNext"><b>GO NEXT</b><small>${n?n.d.name:"Complete"}</small></button>
 <button class="action" id="aMiss"><b>DON'T MISS</b><small>S+ and S experiences</small></button>
 <button class="action" id="aJourney"><b>MY JOURNEY</b><small>${done} / ${ex.length} experiences complete</small></button>
 </div>
 <h3>Progress</h3><div class="card"><b>${pct}% complete</b><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>
 <button class="btn wide" id="loc">Change current location</button>`;
 document.getElementById("aDo").onclick=doHere;
 document.getElementById("aNext").onclick=goNext;
 document.getElementById("aMiss").onclick=dontMiss;
 document.getElementById("aJourney").onclick=journey;
 document.getElementById("loc").onclick=setLocation;
}
function expCard(r){const done=!!state.done[r.id],skip=!!state.skip[r.id];return '<div class="card experience '+(done||skip?"done":"")+'"><span class="badge '+(r.e.tier==="S+"?"splus":"")+'">'+r.e.tier+'</span><span class="badge type">'+r.e.type+'</span><h2>'+r.e.name+'</h2><p>'+r.e.summary+'</p><div class="facts"><div class="fact"><b>Booking</b><br>'+r.e.booking+'</div><div class="fact"><b>Content</b><br>'+r.e.content+'</div></div><button class="btn expDone" data-id="'+r.id+'">'+(done?"Completed":"Mark complete")+'</button><button class="btn expSkip" data-id="'+r.id+'">'+(skip?"Skipped":"Skip")+'</button></div>'}
function doHere(){let x=cur();if(!x){const r=allDest()[0];x=r}const list=x.d.experiences.map((e,j)=>({c:x.c,d:x.d,i:x.i,e,j,id:x.c.id+"-"+x.i+"-"+j}));app.innerHTML=head("DO HERE")+'<section class="hero"><div class="kicker">'+x.c.code+" / "+x.d.stay+' DAYS/NIGHTS</div><h1>'+x.d.name+'</h1><p>'+list.filter(r=>!state.done[r.id]&&!state.skip[r.id]).length+" unfinished experiences</p></section>"+list.map(expCard).join("")+'<button class="btn wide" id="back">Back</button>';bindExp();back.onclick=home}
function bindExp(){document.querySelectorAll(".expDone").forEach(b=>b.onclick=function(){state.done[b.dataset.id]=!state.done[b.dataset.id];if(state.done[b.dataset.id])delete state.skip[b.dataset.id];save();doHere()});document.querySelectorAll(".expSkip").forEach(b=>b.onclick=function(){state.skip[b.dataset.id]=!state.skip[b.dataset.id];if(state.skip[b.dataset.id])delete state.done[b.dataset.id];save();doHere()})}
function goNext(){const r=nextDest();app.innerHTML=head("GO NEXT")+(r?'<section class="hero"><div class="kicker">NEXT UNFINISHED DESTINATION</div><h1>'+r.c.name+" / "+r.d.name+'</h1><p>'+r.d.stay+' days/nights</p></section><div class="card"><h2>Experiences unlocked</h2>'+r.d.experiences.map(e=>'<p><span class="badge '+(e.tier==="S+"?"splus":"")+'">'+e.tier+'</span> <b>'+e.name+'</b></p>').join("")+'<p class="meta">V0.2 still follows your preserved route. Date, border, transport and budget optimisation will be added only after the experience database is stable.</p></div><button class="btn primary wide" id="arrive">I AM HERE NOW</button>':'<div class="card">Journey complete.</div>');if(r)arrive.onclick=function(){state.here=r.c.id+":"+r.i;save();home()}}
function dontMiss(){const p=allExp().filter(r=>!state.done[r.id]&&!state.skip[r.id]&&(r.e.tier==="S+"||r.e.tier==="S"));app.innerHTML=head("DON'T MISS")+'<section class="hero"><div class="kicker">FOMO CONTROL</div><h1>'+p.length+' major experiences remain</h1></section><h3>Fixed commitments</h3>'+DATA.constraints.map(x=>'<div class="card warn"><b>'+x.label+'</b><div class="meta">'+x.date+'</div></div>').join("")+'<h3>Priority experiences</h3>'+p.map(r=>'<div class="card"><span class="badge '+(r.e.tier==="S+"?"splus":"")+'">'+r.e.tier+'</span><span class="badge type">'+r.e.type+'</span><h2>'+r.e.name+'</h2><div class="meta">'+r.c.name+" / "+r.d.name+'</div><p>'+r.e.summary+'</p></div>').join("")}
function journey(){app.innerHTML=head("MY JOURNEY")+'<section class="hero"><div class="kicker">EXPERIENCE PASSPORT</div><h1>Country chapters</h1><p>Destinations are containers. Experiences are what you are actually collecting.</p></section>'+DATA.countries.map(c=>{const d=DATA.destinations[c.id],ids=allExp().filter(r=>r.c.id===c.id),n=ids.filter(r=>state.done[r.id]).length;return '<div class="card"><h2>'+c.name+'</h2><div class="meta">'+n+" / "+ids.length+" experiences complete / "+d.length+' destination clusters</div><button class="btn wide country" data-id="'+c.id+'">Open country</button></div>'}).join("");document.querySelectorAll(".country").forEach(b=>b.onclick=()=>country(b.dataset.id))}
function country(id){const c=DATA.countries.find(x=>x.id===id);app.innerHTML=head(c.name)+'<section class="hero"><div class="kicker">'+c.code+'</div><h1>'+c.name+'</h1><p>'+c.subtitle+'</p></section>'+DATA.destinations[id].map((d,i)=>'<div class="card"><h2>'+(i+1)+". "+d.name+'</h2><div class="meta">'+d.stay+" days/nights / "+d.experiences.length+' experiences</div>'+d.experiences.map(e=>'<p><span class="badge '+(e.tier==="S+"?"splus":"")+'">'+e.tier+'</span> '+e.name+'</p>').join("")+'<button class="btn open" data-i="'+i+'">Open destination</button></div>').join("")+'<button class="btn wide" id="bj">Back</button>';document.querySelectorAll(".open").forEach(b=>b.onclick=function(){state.here=id+":"+b.dataset.i;save();doHere()});bj.onclick=journey}
function setLocation(){let o='<option value="pre">Pre-departure / Melbourne</option>';DATA.countries.forEach(c=>DATA.destinations[c.id].forEach((d,i)=>{const v=c.id+":"+i;o+='<option value="'+v+'" '+(state.here===v?"selected":"")+'>'+c.name+" / "+d.name+"</option>"}));app.innerHTML=head("SET LOCATION")+'<div class="card"><select id="where">'+o+'</select><button class="btn primary wide" id="set">UPDATE LOCATION</button><button class="btn wide" id="cancel">Cancel</button></div>';set.onclick=function(){state.here=where.value;save();home()};cancel.onclick=home}
document.querySelectorAll("nav button").forEach(b=>b.onclick=function(){const p=b.dataset.page;if(p==="home")home();else if(p==="do")doHere();else if(p==="next")goNext();else if(p==="miss")dontMiss();else journey()});try{landing()}catch(err){app.innerHTML='<div class="card warn"><h2>App error</h2><p>'+String(err.message||err)+'</p></div>'}</script></body></html>

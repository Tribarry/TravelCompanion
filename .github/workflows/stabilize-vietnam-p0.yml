name: Stabilize Vietnam P0
on:
  push:
    branches: [stabilize-vietnam-p0]
    paths:
      - '.github/workflows/stabilize-vietnam-p0.yml'
      - 'data/vietnam-city-hub-v025.js'
      - 'data/vietnam-retire-legacy-hcm-v027.js'
      - 'index.html'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize-vietnam-p0
      - name: Validate shared Vietnam scripts
        run: |
          node --check data/vietnam-city-hub-v025.js
          node --check data/vietnam-photo-alignment-v026.js
          node --check data/vietnam-retire-legacy-hcm-v027.js
      - name: Validate Saigon passport preservation
        run: |
          grep -q "passportPageV17('food')" data/vietnam-city-hub-v025.js
          grep -q "passportPageV17('drink')" data/vietnam-city-hub-v025.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          f=re.search(r'const SAIGON_FOOD_PASSPORT=\[(.*?)\];\s*const SAIGON_DRINK_PASSPORT=',s,re.S)
          d=re.search(r'const SAIGON_DRINK_PASSPORT=\[(.*?)\];\s*function passState',s,re.S)
          if not f or not d:
              raise SystemExit('Saigon passport datasets not found')
          fc=len(re.findall(r'\{id:',f.group(1)))
          dc=len(re.findall(r'\{id:',d.group(1)))
          print('Saigon passport counts:',fc,'food /',dc,'drink')
          if (fc,dc)!=(15,12):
              raise SystemExit(f'Unexpected Saigon passport counts: {fc} food / {dc} drink')
          PY
      - name: Wire legacy retirement last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="data/vietnam-retire-legacy-hcm-v027\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="data/vietnam-retire-legacy-hcm-v027.js?v=20260910-p0"></script>'
          if '</body></html>' not in s:
              raise SystemExit('index.html closing tag not found')
          s=s.replace('</body></html>', tag+'\n</body></html>')
          p.write_text(s)
          PY
          tail -n 12 index.html
          grep -q 'vietnam-city-hub-v025.js' index.html
          grep -q 'vietnam-photo-alignment-v026.js' index.html
          grep -q 'vietnam-retire-legacy-hcm-v027.js' index.html
      - name: Commit staging wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep shared Vietnam hub wiring stable"
          git push origin stabilize-vietnam-p0
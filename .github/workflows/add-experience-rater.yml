name: Add experience rater
on:
  push:
    branches:
      - experience-rater
    paths:
      - .github/workflows/add-experience-rater.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experience-rater
      - name: Apply rater patch
        run: python3 scripts/add_experience_rater.py
      - name: Validate JavaScript
        run: node --check data/travel-companion-v1-shell.js
      - name: Validate rater contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('data/travel-companion-v1-shell.js').read_text()
          css=Path('data/travel-companion-v1-shell.css').read_text()
          assert 'async function renderRatingDeck(' in js
          assert 'state.ratings=state.ratings||{}' in js
          assert 'data-rate-value="must"' in js
          assert 'data-rate-value="keen"' in js
          assert 'data-rate-value="maybe"' in js
          assert 'data-rate-value="pass"' in js
          assert 'ranked=[...available]' in js
          assert 'data-rate-deck' in js
          assert "state.here=id+':'+i" in js
          assert 'SAIGON_FOOD_PASSPORT' in js and 'SAIGON_DRINK_PASSPORT' in js
          assert '/* Experience rater */' in css
          print('Experience rater contract passed')
          PY
      - name: Commit rater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css
          git commit -m "Add swipe experience priority rater"
          git push origin experience-rater

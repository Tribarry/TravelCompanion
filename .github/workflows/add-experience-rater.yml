name: Add experience rater
on:
  push:
    branches: [experience-rater]
    paths:
      - '.github/workflows/add-experience-rater.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experience-rater
      - name: Add swipe rating flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path=Path('data/travel-companion-v1-shell.js')
          js=js_path.read_text()

          # 1) Persist personal ratings separately from canonical tiers / Done / Skip.
          marker="function toggleSkip(id,i,it,j){const v=!hasState('skip',id,i,it,j);setBucket('skip',id,i,it,j,v);if(v)setBucket('done',id,i,it,j,false)}\n"
          addition=r'''const RATING_LABELS={must:"CAN'T MISS",keen:'KEEN',maybe:'MAYBE',pass:'PASS'};
function personalRating(id,i,it,j){const obj=state.ratings||{};for(const k of allKeys(id,i,it,j)){if(obj[k])return obj[k]}return''}
function ratingScore(v){return({must:4,keen:3,maybe:2,'':1,pass:0})[v]??1}
function setPersonalRating(id,i,it,j,value){state.ratings=state.ratings||{};allKeys(id,i,it,j).forEach(k=>state.ratings[k]=value);save()}
function ratingBadge(id,i,it,j){const r=personalRating(id,i,it,j);return r?`<span class="tc1PersonalRating ${r}">YOUR PRIORITY · ${RATING_LABELS[r]}</span>`:''}
'''
          if 'function personalRating(' not in js:
              if marker not in js: raise SystemExit('rating helper marker missing')
              js=js.replace(marker,marker+addition,1)

          # 2) Personal ratings become the first-order signal for destination spotlight priorities.
          old="const o=d.orientation||{},available=its.filter((it,j)=>!hasState('done',id,i,it,it.index??j)&&!hasState('skip',id,i,it,it.index??j)),priority=available.filter(x=>(x.tags||[]).includes('Must Do')||x.tier==='S+'||x.tier==='S'),spotlight=[...priority,...available.filter(x=>!priority.includes(x))].slice(0,3);"
          new="const o=d.orientation||{},available=its.filter((it,j)=>!hasState('done',id,i,it,it.index??j)&&!hasState('skip',id,i,it,it.index??j)),canonicalScore=x=>((x.tags||[]).includes('Must Do')?3:x.tier==='S+'?3:x.tier==='S'?2:1),ranked=[...available].filter(x=>personalRating(id,i,x,x.index)!=='pass').sort((a,b)=>ratingScore(personalRating(id,i,b,b.index))-ratingScore(personalRating(id,i,a,a.index))||canonicalScore(b)-canonicalScore(a)),spotlight=ranked.slice(0,3);"
          if old in js:
              js=js.replace(old,new,1)
          elif 'ranked=[...available]' not in js:
              raise SystemExit('overview ranking marker missing')

          # 3) Put a prominent rate CTA next to the existing explore-all action.
          old_cta='<button class="tc1ExploreAll" data-dest-tab="experiences"><span><b>Explore all ${its.length} experiences</b><small>Must do · local life · history · unique</small></span><span>→</span></button>'
          new_cta='<button class="tc1RateAll" data-rate-deck><span><b>Rate these experiences</b><small>Swipe through them one by one — your ratings set the priorities</small></span><span>→</span></button><button class="tc1ExploreAll" data-dest-tab="experiences"><span><b>Explore all ${its.length} experiences</b><small>Must do · local life · history · unique</small></span><span>→</span></button>'
          if old_cta in js:
              js=js.replace(old_cta,new_cta,1)
          elif 'data-rate-deck' not in js:
              raise SystemExit('overview CTA marker missing')

          # 4) Wire the rater from the destination page.
          wire="document.querySelectorAll('[data-dest-tab]').forEach(b=>b.onclick=()=>renderDestination(id,i,b.dataset.destTab,'All',b.dataset.pass||'food'));\n"
          wire_add="document.querySelectorAll('[data-rate-deck]').forEach(b=>b.onclick=()=>renderRatingDeck(id,i));\n"
          if wire_add not in js:
              if wire not in js: raise SystemExit('destination wiring marker missing')
              js=js.replace(wire,wire+wire_add,1)

          # 5) Focused one-card-at-a-time swipe / rate view.
          deck=r'''async function renderRatingDeck(id,i,pos=0){
 await readyCountry(id);const c=country(id),d=destinations(id)[i],its=getItems(id,i);if(!d||!its.length)return renderDestination(id,i,'experiences');V.last='rater';
 const counts={must:0,keen:0,maybe:0,pass:0,unrated:0};its.forEach((x,n)=>{const r=personalRating(id,i,x,x.index??n);if(r&&counts[r]!==undefined)counts[r]++;else counts.unrated++});
 if(pos>=its.length){setApp(`<section class="tc1Screen tc1RaterScreen">${topButtons(`data-back-rater="${id}:${i}"`)}<div class="tc1RaterSummary"><div class="tc1Scope">${esc(d.name)} · priorities</div><h1>Ratings complete.</h1><p>Your choices now drive the experience spotlights on this destination overview. Nothing has been deleted or marked Done/Skipped.</p><div class="tc1RatingSummaryGrid"><div><b>${counts.must}</b><small>CAN'T MISS</small></div><div><b>${counts.keen}</b><small>KEEN</small></div><div><b>${counts.maybe}</b><small>MAYBE</small></div><div><b>${counts.pass}</b><small>PASS</small></div></div><button class="tc1RatePrimary" data-rate-review>REVIEW AGAIN</button><button class="tc1RateSecondary" data-rate-back>BACK TO ${esc(d.name.toUpperCase())}</button></div>${drawer()}</section>`);document.querySelector('[data-back-rater]').onclick=()=>renderDestination(id,i,'overview');document.querySelector('[data-rate-review]').onclick=()=>renderRatingDeck(id,i,0);document.querySelector('[data-rate-back]').onclick=()=>renderDestination(id,i,'overview');return}
 pos=Math.max(0,Math.min(pos,its.length-1));const it=its[pos],j=it.index??pos,r=personalRating(id,i,it,j),rated=its.length-counts.unrated;
 const photo=id==='vietnam'?`<div class="tc1RatePhoto vnFallback" data-vnimg="${esc(it.title)}" data-label="${esc(it.title)}"></div>`:`<div class="tc1RatePhoto tc1NoPhoto" data-label="${esc(it.title)}"></div>`;
 setApp(`<section class="tc1Screen tc1RaterScreen">${topButtons(`data-back-rater="${id}:${i}"`)}<div class="tc1RaterHead"><div><div class="tc1Scope">RATE · ${esc(d.name)}</div><h1>How does this sound?</h1></div><small>${rated}/${its.length} rated</small></div><div class="tc1RateProgress"><i style="width:${Math.round((rated/its.length)*100)}%"></i></div><div class="tc1RateStage"><article class="tc1RateCard" data-rate-card>${photo}<div class="tc1RateCopy"><div class="tc1Tags">${(it.tags||[]).slice(0,3).map(t=>`<i>${esc(t)}</i>`).join('')}</div><h2>${esc(it.title)}</h2><p>${esc(it.summary||'Open the full experience later for practical details.')}</p>${r?`<div class="tc1CurrentRating ${r}">CURRENT · ${RATING_LABELS[r]}</div>`:'<div class="tc1CurrentRating unrated">NOT RATED YET</div>'}</div></article><div class="tc1SwipeHint">← previous · swipe · next →</div></div><div class="tc1RatingButtons"><button data-rate-value="must" class="${r==='must'?'on':''}"><b>🔥</b><span>CAN'T MISS</span></button><button data-rate-value="keen" class="${r==='keen'?'on':''}"><b>👍</b><span>KEEN</span></button><button data-rate-value="maybe" class="${r==='maybe'?'on':''}"><b>🤔</b><span>MAYBE</span></button><button data-rate-value="pass" class="${r==='pass'?'on':''}"><b>×</b><span>PASS</span></button></div><div class="tc1RateNav"><button data-rate-prev ${pos===0?'disabled':''}>← PREV</button><button data-rate-later>RATE LATER</button><button data-rate-next>NEXT →</button></div>${drawer()}</section>`);
 document.querySelector('[data-back-rater]').onclick=()=>renderDestination(id,i,'overview');
 document.querySelectorAll('[data-rate-value]').forEach(b=>b.onclick=()=>{setPersonalRating(id,i,it,j,b.dataset.rateValue);renderRatingDeck(id,i,pos+1)});
 const prev=()=>renderRatingDeck(id,i,Math.max(0,pos-1)),next=()=>renderRatingDeck(id,i,pos+1);const pb=document.querySelector('[data-rate-prev]');if(pb)pb.onclick=prev;document.querySelector('[data-rate-next]').onclick=next;document.querySelector('[data-rate-later]').onclick=next;
 const card=document.querySelector('[data-rate-card]');let sx=null;if(card){card.addEventListener('pointerdown',e=>{sx=e.clientX;card.setPointerCapture?.(e.pointerId)});card.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(dx>55&&pos>0)prev();else if(dx<-55)next()})}
}
'''
          if 'async function renderRatingDeck(' not in js:
              marker2='function experienceList(id,i,filter){'
              if marker2 not in js: raise SystemExit('experienceList marker missing')
              js=js.replace(marker2,deck+marker2,1)

          # 6) Experience list shows the personal priority and offers the same focused rating flow.
          list_start="function experienceList(id,i,filter){let its=getItems(id,i);"
          if list_start in js and 'tc1RateListLaunch' not in js:
              js=js.replace("return `<div class=\"tc1Filters\">${filters.map", "return `<button class=\"tc1RateAll tc1RateListLaunch\" data-rate-deck><span><b>Rate ${getItems(id,i).length} experiences</b><small>One card at a time · ratings drive your destination priorities</small></span><span>→</span></button><div class=\"tc1Filters\">${filters.map",1)
              js=js.replace("<h3>${esc(it.title)}</h3><p>", "<h3>${esc(it.title)}</h3>${ratingBadge(id,i,it,j)}<p>",1)

          js_path.write_text(js)

          css_path=Path('data/travel-companion-v1-shell.css')
          css=css_path.read_text()
          if '/* Experience rater */' not in css:
              css += r'''

/* Experience rater */
.tc1RateAll{width:100%;border:0;background:var(--tc-orange);color:#fff;border-radius:16px;padding:15px 16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;text-align:left}.tc1RateAll b{display:block;font:700 19px Georgia,serif}.tc1RateAll small{display:block;margin-top:3px;font-size:8px;letter-spacing:.035em;color:#fff;opacity:.78}.tc1RateListLaunch{width:calc(100% - 36px);margin:14px 18px 4px}.tc1PersonalRating{display:inline-block;margin:1px 0 4px;border-radius:999px;padding:5px 7px;font-size:7px;font-weight:900;letter-spacing:.05em}.tc1PersonalRating.must{background:#c64c3d;color:#fff}.tc1PersonalRating.keen{background:#d87b45;color:#fff}.tc1PersonalRating.maybe{background:#35353b;color:#f1f1f2}.tc1PersonalRating.pass{background:#202024;color:#9d9da4;text-decoration:line-through}.tc1RaterScreen{background:#050506!important;color:#f5f5f6!important;padding-bottom:28px}.tc1RaterHead{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.tc1RaterHead h1{font:700 34px/.96 Georgia,serif;margin:4px 0 0}.tc1RaterHead>small{font-size:8px;font-weight:900;letter-spacing:.08em;color:#a6a6ad;white-space:nowrap}.tc1RateProgress{height:5px;background:#232328;margin:0 18px 15px;border-radius:999px;overflow:hidden}.tc1RateProgress i{display:block;height:100%;background:var(--tc-orange)}.tc1RateStage{padding:0 18px}.tc1RateCard{background:#111114;border:1px solid #2b2b30;border-radius:23px;overflow:hidden;touch-action:pan-y;user-select:none;box-shadow:0 18px 50px #0008}.tc1RatePhoto{height:330px;background:#1b1b1e center/cover no-repeat;position:relative}.tc1RatePhoto.tc1NoPhoto:before{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;font:700 22px Georgia,serif;color:#ddd;background:linear-gradient(135deg,#151518,#33343a)}.tc1RateCopy{padding:17px}.tc1RateCopy h2{font:700 31px/.98 Georgia,serif;margin:9px 0 8px;color:#fff}.tc1RateCopy p{font-size:11px;line-height:1.5;color:#b9b9c0;margin:0}.tc1CurrentRating{display:inline-block;margin-top:12px;border-radius:999px;padding:7px 9px;font-size:7px;font-weight:900;letter-spacing:.07em}.tc1CurrentRating.must{background:#c64c3d}.tc1CurrentRating.keen{background:#d87b45}.tc1CurrentRating.maybe{background:#34343a}.tc1CurrentRating.pass{background:#202024;color:#aaa}.tc1CurrentRating.unrated{border:1px solid #3a3a40;color:#9b9ba2}.tc1SwipeHint{text-align:center;font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:#74747c;margin:10px 0 2px}.tc1RatingButtons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 18px 4px}.tc1RatingButtons button{min-height:72px;border:1px solid #303036;background:#121215;color:#d9d9dd;border-radius:15px;padding:9px 4px}.tc1RatingButtons button b{display:block;font-size:18px;line-height:1}.tc1RatingButtons button span{display:block;font-size:7px;font-weight:900;letter-spacing:.04em;margin-top:7px}.tc1RatingButtons button.on{outline:2px solid var(--tc-orange);background:#211612}.tc1RateNav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:7px 18px 18px}.tc1RateNav button{border:0;background:#1a1a1e;color:#bdbdc4;border-radius:12px;padding:11px 4px;font-size:7px;font-weight:900}.tc1RateNav button:disabled{opacity:.25}.tc1RaterSummary{padding:74px 18px 30px}.tc1RaterSummary h1{font:700 48px/.92 Georgia,serif;margin:8px 0 14px}.tc1RaterSummary p{font-size:11px;line-height:1.55;color:#b8b8bf;max-width:360px}.tc1RatingSummaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}.tc1RatingSummaryGrid div{background:#141417;border:1px solid #2c2c31;border-radius:16px;padding:16px;text-align:center}.tc1RatingSummaryGrid b{display:block;font:700 29px Georgia,serif}.tc1RatingSummaryGrid small{font-size:7px;letter-spacing:.08em}.tc1RatePrimary,.tc1RateSecondary{width:100%;border-radius:999px;padding:14px;margin-top:8px;font-weight:900}.tc1RatePrimary{border:0;background:var(--tc-orange);color:#fff}.tc1RateSecondary{border:1px solid #34343a;background:#111114;color:#ddd}@media(max-width:360px){.tc1RatePhoto{height:285px}.tc1RatingButtons{gap:5px}.tc1RatingButtons button span{font-size:6px}}
'''
          css_path.write_text(css)
          PY
      - name: Validate rater
        run: |
          node --check data/travel-companion-v1-shell.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('data/travel-companion-v1-shell.js').read_text()
          css=Path('data/travel-companion-v1-shell.css').read_text()
          assert 'async function renderRatingDeck(' in js
          assert 'state.ratings=state.ratings||{}' in js
          assert 'data-rate-value="must"' in js
          assert 'data-rate-value="keen"' in js
          assert 'data-rate-value="maybe"' in js
          assert 'data-rate-value="pass"' in js
          assert 'ranked=[...available]' in js
          assert 'data-rate-deck' in js
          assert "state.here=id+':'+i" in js
          assert 'SAIGON_FOOD_PASSPORT' in js and 'SAIGON_DRINK_PASSPORT' in js
          assert '/* Experience rater */' in css
          print('Experience rater validated: personal ratings persist separately and feed destination priority order.')
          PY
      - name: Commit rater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css
          git commit -m "Add swipe experience priority rater"
          git push origin experience-rater

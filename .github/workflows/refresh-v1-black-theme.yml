name: Refresh V1 black theme
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v1-black-theme.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Asia title and black palette
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path=Path('data/travel-companion-v1-shell.js')
          js=js_path.read_text()
          old='<h1>Southeast Asia<br>2027.</h1>'
          new='<h1>Asia<br>2027.</h1>'
          if old not in js:
              raise SystemExit('Expected Southeast Asia title not found')
          js=js.replace(old,new,1)
          js_path.write_text(js)

          css_path=Path('data/travel-companion-v1-shell.css')
          css=css_path.read_text()
          old_root=':root{--tc-paper:#f2eee8;--tc-paper2:#fffaf3;--tc-ink:#25262c;--tc-forest:#2a2f3b;--tc-forest2:#191d26;--tc-orange:#c66649;--tc-mustard:#d5a64c;--tc-muted:#706d70;--tc-line:#ddd4ca}'
          new_root=':root{--tc-paper:#050505;--tc-paper2:#111111;--tc-ink:#f4f2ee;--tc-forest:#1a1a1a;--tc-forest2:#000000;--tc-orange:#d66a45;--tc-mustard:#d5a64c;--tc-muted:#aaa6a1;--tc-line:#2c2c2c}'
          if old_root not in css:
              raise SystemExit('Expected current palette not found')
          css=css.replace(old_root,new_root,1)
          replacements={
            'html,body{background:#111!important}':'html,body{background:#000!important}',
            '#eadfce':'#1c1c1c',
            '#e2d8c9':'#242424',
            '#e9dfd0':'#1c1c1c',
            '#d7c8b5':'#3a3a3a',
            '#67736d':'#aaa6a1',
            '#526159':'#b7b2ad',
            '#65716b':'#aaa6a1',
            '#6a756f':'#aaa6a1',
            '#5f6c65':'#aaa6a1',
            '#9a4b31':'#e18462',
            '.tc1Actions button{border:1px solid var(--tc-line);background:#fff;':'.tc1Actions button{border:1px solid var(--tc-line);background:var(--tc-paper2);'
          }
          for a,b in replacements.items():
              css=css.replace(a,b)
          css_path.write_text(css)
          PY
      - name: Validate black theme
        run: |
          node --check data/travel-companion-v1-shell.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('data/travel-companion-v1-shell.js').read_text()
          css=Path('data/travel-companion-v1-shell.css').read_text()
          assert '<h1>Asia<br>2027.</h1>' in js
          assert 'Southeast Asia<br>2027.' not in js
          assert '--tc-paper:#050505' in css
          assert '--tc-paper2:#111111' in css
          assert '--tc-ink:#f4f2ee' in css
          assert '#f2eee8' not in css
          assert '#fffaf3' not in css
          print('Asia title and black V1 theme validated.')
          PY
      - name: Commit theme update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css
          git commit -m "Use Asia title and black V1 theme"
          git push origin main

name: Restore Cái Bè floating market photo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore full alignment v029 from known-good SHA
        run: |
          git show c979aa71ccac9e01cca3b1dca47e904eda29eb53:data/vietnam-photo-alignment-v026.js > /tmp/base.js
          wc -c /tmp/base.js
          echo "" | base64 -d > /tmp/patch_align.py
          python3 /tmp/patch_align.py
          grep -n 'HATIEN_LOCAL\|hydrateVN' data/vietnam-photo-alignment-v026.js | head

      - name: Cần Giờ mangrove from Commons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' \
            -o /tmp/can-gio.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Can_Gio_mangrove_forest.jpg?width=1600'
          convert /tmp/can-gio.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/hcmc/can-gio.jpg
          ls -la assets/images/hcmc/can-gio.jpg

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js assets/images/hcmc/can-gio.jpg
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): restore full photo alignment v029 + wire new banks; Cần Giờ mangrove'
          git push origin HEAD:main

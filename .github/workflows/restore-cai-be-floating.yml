name: Restore Cái Bè floating market photo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire Bến Tre into alignment
        run: |
          python3 << 'PY'
from pathlib import Path
p = Path('data/vietnam-photo-alignment-v026.js')
s = p.read_text()
if 'BENTRE_LOCAL' in s:
    print('already wired')
else:
    block = '''
const BENTRE_LOCAL=[
 [/market|chợ|cho ben tre/i,'assets/images/ben-tre/01-market.jpg'],
 [/river|sông|song/i,'assets/images/ben-tre/02-river.jpg'],
 [/bến tre|ben tre/i,'assets/images/ben-tre/01-market.jpg']
];

'''
    s = s.replace('const HATIEN_LOCAL=[', block + 'const HATIEN_LOCAL=[', 1)
    if "if(n==='ben tre')" not in s:
        s = s.replace(
            " if(n==='ha tien') return 'assets/images/destinations/ha-tien.jpg';",
            " if(n==='ben tre') return 'assets/images/destinations/ben-tre.jpg';\n if(n==='ha tien') return 'assets/images/destinations/ha-tien.jpg';",
            1)
    if 'add(BENTRE_LOCAL)' not in s:
        s = s.replace(
            ' if(/ha tien/.test(dest)) add(HATIEN_LOCAL);',
            ' if(/ben tre/.test(dest)) add(BENTRE_LOCAL);\n if(/ha tien/.test(dest)) add(HATIEN_LOCAL);',
            1)
        s = s.replace(
            'add(HATIEN_LOCAL);add(PHUQUOC_LOCAL);add(CONDAO_LOCAL);',
            'add(BENTRE_LOCAL);add(HATIEN_LOCAL);add(PHUQUOC_LOCAL);add(CONDAO_LOCAL);',
            1)
    p.write_text(s)
    print('wired Bến Tre', len(s))
assert 'window.hydrateVN=function' in p.read_text()
print('hydrate OK')
PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): wire Bến Tre local bank into photo alignment'
          git push origin HEAD:main

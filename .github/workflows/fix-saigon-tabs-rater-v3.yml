name: Fix Saigon tabs and rater V3
on:
  push:
    branches: [rater-cinematic-v2]
    paths:
      - 'scripts/fix_saigon_tabs_and_rater_v3.py'
      - '.github/workflows/fix-saigon-tabs-rater-v3.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rater-cinematic-v2
          fetch-depth: 0
      - name: Apply repair
        run: python3 scripts/fix_saigon_tabs_and_rater_v3.py
      - name: Validate JS syntax
        run: node --check data/travel-companion-v1-shell.js
      - name: Validate restored destination contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('data/travel-companion-v1-shell.js').read_text()
          c=Path('data/rater-cinematic-v2.css').read_text()
          required=['function experienceList(id,i,filter)','function wireExperienceActions(id,i,tab,filter,passType)','function passportView(id,i,type)','function wirePassport(id,i,type)','function mapView(id,i)','async function renderDetail(id,i,j)']
          for x in required: assert x in s, x
          assert "tab==='experiences')body=experienceList" in s
          assert "tab==='food')body=passportView" in s
          assert 'data-direct-photo="true"' in s
          assert 'tc1RatePhotoDirect' in c
          assert "state.here=id+':'+i" in s and s.count("state.here=id+':'+i")==1
          print('SAIGON TAB + RATER CONTRACT PASS')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/rater-cinematic-v2.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore Saigon tabs and protect rater photos"
            git push origin HEAD:rater-cinematic-v2
          fi

name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from last good commit
        run: |
          git config user.name "restore-bot"
          git config user.email "restore@local"
          git checkout 72ec0e06f203a420685a21f9d4f7c6317405029a -- index.html
          git add index.html
          git status
          git commit -m "Restore full index.html from good commit 72ec0e06 (before accidental wipe)" || echo "Already restored"
          git push

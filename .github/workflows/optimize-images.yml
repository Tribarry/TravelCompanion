name: Optimise travel images

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/originals/**'
      - 'scripts/optimize-images.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run images
      - name: Commit generated WebP images
        run: |
          if git diff --quiet -- assets/images/generated && [ -z "$(git status --porcelain assets/images/generated)" ]; then
            echo 'No generated image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/generated
          git commit -m 'chore: optimise travel images'
          git push

name: Publish Vietnam city hero dashboard
on:
  push:
    paths:
      - '.github/workflows/wire-vietnam-city-hub.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire city hero dashboard into live app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="data/vietnam-city-hub-v024\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="data/vietnam-city-hub-v024.js?v=20260910-1755"></script>'
          s=s.replace('</body></html>', tag+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit live city dashboard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish city hero dashboard for every Vietnam destination"
          git push
name: App integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect the app shell
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < index.html)
          echo "index.html bytes: $bytes"
          test "$bytes" -gt 150000
          grep -q '<!doctype html>' index.html
          grep -q 'Travel Companion' index.html
          ! grep -q 'PLACEHOLDER_WILL_BE_TOO_LARGE' index.html
      - name: Verify route map assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in vietnam-country.png vietnam-zone-south.png vietnam-zone-mekong.png vietnam-zone-highlands.png vietnam-zone-central.png vietnam-zone-north.png; do
            test -s "$asset"
          done
      - name: Syntax-check critical runtimes
        run: |
          node --check data/travel-companion-v1-shell.js
          node --check data/main-country-carousel-v1.js
          node --check data/adhd-focus-mode-v1.js
          node --check data/country-route-map-v1.js
          node --check data/mekong-closeup-v1.js
          node --check data/remaining-countries-photo-audit-v1.js
          node --check data/remaining-countries-photo-bridge-v1.js
          node --check data/laos-audited-structure-v1.js
          node --check data/vietnam-curated-photo-supplement-v1.js
          node --check data/vietnam-experience-content-v3.js
          node --check data/vietnam-next10-exact-photo-audit-v1.js
          node --check data/vietnam-remaining-content-audit-v1.js
          node --check data/vietnam-remaining-photo-audit-v1.js
          node --check data/vietnam-photo-manifest-v1.js
          node --check data/vietnam-photo-ui-fixes-v1.js
          node --check data/vietnam-quality-curation-v1.js
          node --check data/destination-food-passports-v1.js
      - name: Protect Vietnam content and state invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          shell=Path('data/travel-companion-v1-shell.js').read_text()
          live=Path('data/vietnam-live-v021.js').read_text()
          remaining=Path('data/vietnam-remaining-photo-audit-v1.js').read_text()
          foodbank=Path('data/destination-food-passports-v1.js').read_text()
          assert 'docs/VIETNAM_LOCKED_EXPERIENCE_BANK_2027.md' in live
          assert 'existing 15-item Saigon passport in the shell' in foodbank, 'Sài Gòn Food Passport contract changed'
          assert len(re.findall(r'state\.here\s*=(?!=)',shell))==1, 'browsing must not change current location'
          assert 'data-set-here' in shell
          assert "document.querySelectorAll('[data-open-dest]').forEach" in shell
          assert "renderDestination(id,Number(b.dataset.openDest),'overview')" in shell
          assert 'Unresolved cards remain PHOTO TO VERIFY' in remaining
          assert "licenseStatus:'TO CHECK'" in remaining
          assert "attributionStatus:'TO CHECK'" in remaining
          print('Vietnam canonical bank, passport contract, browsing/current-location separation and unresolved-photo policy preserved.')
          PY
      - name: Verify loader wiring
        run: |
          grep -q 'adhd-focus-mode-v1.js?v=20260912-focus2' data/main-country-carousel-v1.js
          grep -q 'country-route-map-v1.js?v=20260912-map2' data/main-country-carousel-v1.js
          grep -q 'mekong-closeup-v1.js?v=20260912-mekong1' data/main-country-carousel-v1.js
          grep -q 'remaining-countries-photo-audit-v1.js?v=20260912-rp1' data/main-country-carousel-v1.js
          grep -q 'remaining-countries-photo-bridge-v1.js?v=20260912-rpb1' data/main-country-carousel-v1.js

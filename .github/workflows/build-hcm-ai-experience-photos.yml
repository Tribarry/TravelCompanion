name: Build HCMC AI experience photos
on:
  push:
    branches: [rater-fit-and-photo-v4]
    paths:
      - 'scripts/generate_hcm_ai_experience_photos.sh'
      - 'scripts/apply_hcm_ai_photo_ui.py'
      - '.github/workflows/build-hcm-ai-experience-photos.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rater-fit-and-photo-v4
          fetch-depth: 0
      - name: Generate 21 realistic AI experience photos
        run: bash scripts/generate_hcm_ai_experience_photos.sh
      - name: Integrate local photos and repair experience browse UI
        run: python3 scripts/apply_hcm_ai_photo_ui.py
      - name: Validate image bank
        run: |
          test "$(find assets/ai/hcm -maxdepth 1 -name '*.jpg' | wc -l)" -eq 21
          for f in assets/ai/hcm/*.jpg; do
            test "$(stat -c%s "$f")" -gt 30000
            file "$f" | grep -Eq 'JPEG image data|PNG image data'
          done
      - name: Validate app contract
        run: |
          node --check data/hcm-rater-content-v2.js
          node --check data/travel-companion-v1-shell.js
          python3 - <<'PY'
          from pathlib import Path
          h=Path('data/hcm-rater-content-v2.js').read_text()
          s=Path('data/travel-companion-v1-shell.js').read_text()
          c=Path('data/travel-companion-v1-shell.css').read_text()
          r=Path('data/rater-cinematic-v2.css').read_text()
          assert h.count("photo:'assets/ai/hcm/")==21
          assert 'tc1FilterLabel' in s and 'FILTER EXPERIENCES' in s
          assert 'tc1ExpPhotoDirect' in s and 'experienceListFacts' in s
          assert 'HCMC experience browse repair' in c
          assert 'AI VISUAL' in r
          assert 'function passportView(id,i,type)' in s
          assert "state.here=id+':'+i" in s and s.count("state.here=id+':'+i")==1
          print('HCMC AI PHOTO + UI CONTRACT PASS')
          PY
      - name: Commit generated assets and UI repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ai/hcm data/hcm-rater-content-v2.js data/rater-cinematic-v2.css data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add local AI visuals for all Saigon experiences'
            git push origin HEAD:rater-fit-and-photo-v4
          fi

name: Wire Vietnam graphics V0.28
on:
  push:
    branches: [audit-vietnam-graphics]
    paths:
      - '.github/workflows/wire-vietnam-graphics-v028.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-vietnam-graphics
      - name: Validate runtime
        run: |
          node --check data/vietnam-photo-alignment-v026.js
          node --check data/vietnam-graphics-runtime-v028.js
          grep -q "typeof state!='undefined'" data/vietnam-graphics-runtime-v028.js
          grep -q "data-vnimg" data/vietnam-graphics-runtime-v028.js
      - name: Wire runtime last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          s=re.sub(r'\s*<script src="data/vietnam-graphics-runtime-v028\.js\?v=[^"]+"></script>','',s)
          tag='<script src="data/vietnam-graphics-runtime-v028.js?v=20260910-graphics-v028"></script>'
          if '</body></html>' not in s: raise SystemExit('closing tag not found')
          s=s.replace('</body></html>',tag+'\n</body></html>')
          p.write_text(s)
          PY
          tail -n 10 index.html
      - name: Validate final script order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.rfind('vietnam-photo-alignment-v026.js')
          r=s.rfind('vietnam-retire-legacy-hcm-v027.js')
          g=s.rfind('vietnam-graphics-runtime-v028.js')
          assert a!=-1 and r!=-1 and g!=-1
          assert a<r<g, (a,r,g)
          print('v026 resolver -> v027 legacy retirement -> v028 graphics runtime')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire verified graphics across Vietnam views"
          git push origin audit-vietnam-graphics
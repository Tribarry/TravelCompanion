name: Fix timeline constraint
on:
  push:
    branches: [audit-core-fixes-v1]
    paths:
      - '.github/workflows/fix-timeline-constraint.yml'
      - 'scripts/fix_timeline_constraints.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-core-fixes-v1
          fetch-depth: 0
      - run: python3 scripts/fix_timeline_constraints.py
      - name: Validate
        run: |
          grep -q '"date":"22 Jul 2027","label":"Central Asia leg"' index.html
          ! grep -q '"date":"1 Aug 2027","label":"Central Asia leg"' index.html
          node --check data/travel-companion-v1-shell.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo no-change; else git commit -m "Correct Central Asia timeline constraint" && git push origin HEAD:audit-core-fixes-v1; fi

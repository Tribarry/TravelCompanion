name: "Run final content pass"
on:
  push:
    branches:
      - finish-content-pass
    paths:
      - .github/workflows/run-final-content-pass.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-content-pass
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/finalize_experience_content.py
      - name: Check JavaScript
        run: |
          node --check data/experience-copy-v2.js
          node --check data/travel-companion-v1-shell.js
          node --check data/remaining-countries-v1-content.js
          node --check data/hcm-v21-experiences.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css docs/EXPERIENCE_CONTENT_AUDIT.md
          git commit -m "Finish experience content and image policy"
          git push origin finish-content-pass

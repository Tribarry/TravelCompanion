name: Audit Vietnam graphics
on:
  push:
    branches: [audit-vietnam-graphics]
    paths:
      - 'data/vietnam-photo-alignment-v026.js'
      - '.github/workflows/audit-vietnam-graphics.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check data/vietnam-photo-alignment-v026.js
      - name: Enforce verification-first image policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('data/vietnam-photo-alignment-v026.js').read_text()
          required=['PHOTO TO VERIFY','const LANDMARKS=','const DISHES=','window.hydrateVN']
          for token in required:
              assert token in s, f'missing {token}'
          banned=['strictSearchPhoto(','return currentName?destinationPhoto','legacyWiki']
          for token in banned:
              assert token not in s, f'unsafe graphics fallback still present: {token}'
          print('Verification-first policy present; broad/generic fallbacks removed.')
          PY
      - name: Audit mapped Wikipedia pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, urllib.parse, urllib.request
          s=Path('data/vietnam-photo-alignment-v026.js').read_text()
          titles=set()
          dest=re.search(r'const DEST=\{(.*?)\n\};',s,re.S).group(1)
          titles.update(re.findall(r":'([^']+)'",dest))
          for block in ['LANDMARKS','DISHES']:
              body=re.search(rf'const {block}=\[(.*?)\n\];',s,re.S).group(1)
              titles.update(re.findall(r",'([^']+)'\]",body))
          titles=sorted(titles)
          resolved=set(); noimage=set(); missing=set()
          headers={'User-Agent':'TravelCompanionGraphicsAudit/1.0 (personal travel app)'}
          for i in range(0,len(titles),40):
              batch=titles[i:i+40]
              params={
                'action':'query','format':'json','redirects':'1',
                'titles':'|'.join(batch),'prop':'pageimages',
                'piprop':'original|thumbnail','pithumbsize':'1000'
              }
              url='https://en.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              pages=data.get('query',{}).get('pages',{})
              norm_map={x['from']:x['to'] for x in data.get('query',{}).get('normalized',[])}
              redir_map={x['from']:x['to'] for x in data.get('query',{}).get('redirects',[])}
              by_title={p.get('title'):p for p in pages.values()}
              for original in batch:
                  name=norm_map.get(original,original); name=redir_map.get(name,name)
                  p=by_title.get(name)
                  if not p or 'missing' in p:
                      missing.add(original)
                  elif p.get('original') or p.get('thumbnail'):
                      resolved.add(original)
                  else:
                      noimage.add(original)
          print(f'Mapped titles: {len(titles)}; verified image: {len(resolved)}; no image: {len(noimage)}; unresolved title: {len(missing)}')
          if noimage:
              print('NO_IMAGE:')
              for x in sorted(noimage): print(' -',x)
          if missing:
              print('UNRESOLVED_TITLE:')
              for x in sorted(missing): print(' -',x)
          # Missing/no-image mappings are safe: runtime renders PHOTO TO VERIFY.
          PY
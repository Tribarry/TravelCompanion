name: Cái Bè ranked data and hub patch
on:
  push:
    paths:
      - '.github/workflows/cai-be-one-shot-v4.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Cái Bè text and runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          workflow=Path('.github/workflows/cai-be-one-shot.yml').read_text(encoding='utf-8')
          m=re.search(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not m:
              raise SystemExit('Could not extract base Cái Bè patch')
          src=textwrap.dedent(m.group(1))
          src=src.replace('qneedle="  if(!qn)return \'\';"','qneedle=" if(!qn)return \'\';"')
          cut=src.index('          # 8) Download unique Cái Bè / activity-specific photos') if '          # 8) Download unique Cái Bè / activity-specific photos' in src else src.index('# 8) Download unique Cái Bè / activity-specific photos')
          src=src[:cut]
          src += '''\n# Acceptance checks for text/runtime phase.\nbank_txt=Path('docs/VIETNAM_LOCKED_EXPERIENCE_BANK_2027.md').read_text(encoding='utf-8')\nassert '## Cái Bè / Tân Phong — LOCKED 12' in bank_txt\nfor title in ['Dawn floating market','Sampan through nipa canals','Đông Hòa Hiệp ancient village','Ba Đức ancient house (sleep here)','Coconut candy + popped rice','Local islet ferry','Tát mương bắt cá','Tân Phong orchard cycle','Ông Xoát rường house','Home cooking class','Bánh tráng in the sun','Cái Bè Church on the Tiền']:\n    assert title in bank_txt, title\ndur=Path('data/vietnam-duration-mekong-v1.js').read_text(encoding='utf-8')\nassert \"'cai be':['River + village','House + craft + crossing']\" in dur\nassert 'local islet ferry|islet ferry|local ferry' in dur\nhub=Path('data/vietnam-city-hub-v025.js').read_text(encoding='utf-8')\nassert \"c25Days.onclick=()=>typeof vnDuration==='function'?vnDuration():null\" in hub\nidx=Path('index.html').read_text(encoding='utf-8')\nassert 'data/vietnam-duration-mekong-v1.js?v=20260913-cai-be-ranks' in idx\n'''
          exec(compile(src,'cai-be-text-patch.py','exec'), {'__name__':'__main__'})
          PY
      - name: Verify itinerary dates untouched
        run: |
          if ! git diff --quiet -- data/itinerary.json; then
            echo 'Refusing commit: itinerary.json changed.'
            git diff -- data/itinerary.json
            exit 1
          fi
      - name: Commit patch and retire temporary workflows
        run: |
          git config user.name 'Travel Companion Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cai-be-one-shot.yml .github/workflows/cai-be-one-shot-v2.yml .github/workflows/cai-be-one-shot-v3.yml .github/workflows/cai-be-one-shot-v4.yml
          git add docs/VIETNAM_LOCKED_EXPERIENCE_BANK_2027.md docs/CAI_BE_THESE_DAYS_2027.md data/vietnam-duration-mekong-v1.js data/vietnam-live-v021.js data/vietnam-city-hub-v025.js data/vietnam-photo-alignment-v026.js index.html
          git diff --cached --check
          git commit -m 'Update Cái Bè ranked two-day live plan'
          git push origin HEAD:main

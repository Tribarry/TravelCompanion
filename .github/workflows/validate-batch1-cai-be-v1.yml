name: Validate Cái Bè Batch 1
on:
  push:
    branches: [batch1-cai-be-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check data/vietnam-batch1-cai-be-v1.js
          node --check data/main-country-carousel-v1.js
      - name: Protected-state and content checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          layer=Path('data/vietnam-batch1-cai-be-v1.js').read_text()
          shell=Path('data/travel-companion-v1-shell.js').read_text()
          carousel=Path('data/main-country-carousel-v1.js').read_text()
          assert "const DEST='Cái Bè / Tân Phong'" in layer
          assert "window.TC1RaterPhoto" in layer
          assert "window.TC1ExperienceCopy.enrich" in layer
          assert "PHOTO TO VERIFY" in layer
          assert layer.count("R(/") == 17, layer.count("R(/")
          for name in [
              'Tân Phong Island by Bicycle',
              'Sampan Through the Orchard Canals',
              'Sleep in a Mekong Garden House',
              'Tát Mương Bắt Cá — Drain the Ditch & Catch Fish',
              'Cái Bè Morning Market',
              'Family Dinner at the Homestay']:
              assert name in layer, name
          assert "data/vietnam-batch1-cai-be-v1.js" in carousel
          # New layer must never mutate route or travel-state buckets directly.
          for bad in ['state.here=', 'state.currentLocation=', 'state.saved=', 'state.done=', 'state.skip=', 'state.ratings=']:
              assert bad not in layer, bad
          # Existing shell retains the sole current-location write path.
          assert len(re.findall(r'state\.here\s*=(?!=)',shell)) == 1
          assert 'data-set-here' in shell
          assert 'toggleSaved' in shell and 'toggleDone' in shell and 'toggleSkip' in shell
          print('Cái Bè Batch 1: syntax, 17 curated experiences and protected state OK.')
          PY

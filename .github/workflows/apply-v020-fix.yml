name: Apply V0.20 Fix
on:
  push:
    paths:
      - 'tools/apply_v020_fix.py'
      - '.github/workflows/apply-v020-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_v020_fix.py
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix all Vietnam destination hubs and simplify landing"
          git push

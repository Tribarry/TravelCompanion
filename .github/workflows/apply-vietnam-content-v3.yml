name: Apply Vietnam experience content V3
on:
  push:
    branches: [vietnam-content-all-v3]
    paths:
      - 'data/vietnam-experience-content-v3.js'
      - 'scripts/apply_vietnam_content_v3.py'
      - 'scripts/audit_vietnam_content_v3.js'
      - '.github/workflows/apply-vietnam-content-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vietnam-content-all-v3
          fetch-depth: 0
      - name: Apply V3 integration
        run: python3 scripts/apply_vietnam_content_v3.py
      - name: Validate JavaScript
        run: |
          node --check data/vietnam-experience-content-v3.js
          node --check data/experience-copy-v2.js
          node --check data/travel-companion-v1-shell.js
      - name: Audit all Vietnam destination content
        run: node scripts/audit_vietnam_content_v3.js
      - name: Validate integration contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          copy=Path('data/experience-copy-v2.js').read_text()
          shell=Path('data/travel-companion-v1-shell.js').read_text()
          assert 'data/vietnam-experience-content-v3.js?v=20260911-v3' in idx
          assert idx.index('data/vietnam-experience-content-v3.js?v=20260911-v3') < idx.index('data/experience-copy-v2.js?v=20260911-vietnam-v3')
          assert idx.index('data/experience-copy-v2.js?v=20260911-vietnam-v3') < idx.index('data/travel-companion-v1-shell.js?v=20260911-vietnam-v3')
          assert 'TC1VietnamExperienceContent.enrich(destination,item)' in copy
          assert "contentSource:hcm?'hcm-curated':(vn?.source||'normalised')" in copy
          assert "['Best time',it.best||extra?.best||raw.best||'Depends on conditions']" in shell
          # Protected state semantics: one explicit location mutation in the V1 shell.
          assert shell.count("state.here=id+':'+i") == 1
          # Food passport integration remains present.
          assert 'foodPassportItems(id,i)' in shell and 'data-food-tried' in shell
          # HCMC curated passport and experience catalogue stay wired.
          assert 'hcm-v21-experiences.js' in idx
          assert 'destination-food-passports-v1.js' in idx
          report=Path('docs/VIETNAM_EXPERIENCE_CONTENT_V3_AUDIT.md').read_text()
          assert '59 Vietnam stops' in report
          print('VIETNAM V3 INTEGRATION CONTRACT PASS')
          PY
      - name: Commit integrated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/vietnam-experience-content-v3.js data/experience-copy-v2.js data/travel-companion-v1-shell.js docs/VIETNAM_EXPERIENCE_CONTENT_V3_AUDIT.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate bespoke Vietnam experience content across all destinations"
            git push origin HEAD:vietnam-content-all-v3
          fi

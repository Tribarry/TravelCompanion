name: Apply V0.19 Vietnam
on:
  push:
    paths:
      - 'tools/apply_v019_vietnam_all.py'
      - '.github/workflows/apply-v019-vietnam.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_v019_vietnam_all.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply HCMC destination model across Vietnam"
          git push

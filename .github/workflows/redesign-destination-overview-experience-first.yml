name: Redesign destination overview experience first
on:
  push:
    branches:
      - destination-experience-first
    paths:
      - scripts/redesign_destination_overview.py
      - .github/workflows/redesign-destination-overview-experience-first.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: destination-experience-first
      - name: Apply redesign
        run: python3 scripts/redesign_destination_overview.py
      - name: Check JavaScript
        run: node --check data/travel-companion-v1-shell.js
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/travel-companion-v1-shell.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make destination overview experience first"
            git push origin destination-experience-first
          fi

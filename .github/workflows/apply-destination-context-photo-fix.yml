name: Apply destination context photo fix
on:
  push:
    branches: [destination-context-photo-fix]
    paths:
      - 'scripts/apply_destination_context_photo_fix.py'
      - '.github/workflows/apply-destination-context-photo-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: destination-context-photo-fix
      - name: Apply patch
        run: python3 scripts/apply_destination_context_photo_fix.py
      - name: Validate JavaScript
        run: node --check data/travel-companion-v1-shell.js
      - name: Validate contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('data/travel-companion-v1-shell.js').read_text()
          assert 'Destination context' not in s
          assert 'tc1OverviewContext' not in s
          assert 'TC1RaterPhoto?.(id,d,it)' in s
          assert "state.here=id+':'+i" in s
          print('CONTRACT PASS')
          PY
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-companion-v1-shell.js data/rater-cinematic-v2.css index.html
          git commit -m "Remove destination context and restore spotlight photos"
          git push origin HEAD:destination-context-photo-fix

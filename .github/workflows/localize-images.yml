name: Localise remote travel images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rewrite-local-images.mjs'
      - '.github/workflows/localize-images.yml'

permissions:
  contents: write

jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download currently referenced remote images
        run: node scripts/localize-images.mjs
      - name: Generate responsive WebP variants
        run: |
          npm install --no-audit --no-fund
          npm run images
      - name: Switch static references to local WebPs
        run: node scripts/rewrite-local-images.mjs
      - name: Commit migration output
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images data index.html sw.js
          git commit -m 'chore: switch static travel images to local WebPs'
          git push --force-with-lease origin HEAD:image-migration-output

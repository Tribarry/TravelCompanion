name: Localise remote travel images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-migration-output
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download currently referenced remote images
        run: node scripts/localize-images.mjs
      - name: Generate responsive WebP variants
        run: |
          npm install --no-audit --no-fund
          npm run images
      - name: Commit migration output
        run: |
          if [ -z "$(git status --porcelain assets/images)" ]; then
            echo 'No image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          git commit -m 'chore: localise current remote travel images'
          git push origin HEAD:image-migration-output

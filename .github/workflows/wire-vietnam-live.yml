name: Wire Vietnam live experience bank
on:
  push:
    paths:
      - '.github/workflows/wire-vietnam-live.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load canonical Vietnam bank on live app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="data/vietnam-live-v021.js?v=20260910-full"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit live wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load all locked Vietnam experiences in live app"
          git push

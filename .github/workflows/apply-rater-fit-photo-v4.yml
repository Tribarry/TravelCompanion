name: Apply rater fit and photo V4
on:
  push:
    branches: [rater-fit-and-photo-v4]
    paths:
      - 'scripts/apply_rater_fit_photo_v4.py'
      - '.github/workflows/apply-rater-fit-photo-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rater-fit-and-photo-v4
          fetch-depth: 0
      - name: Apply visual fit repair
        run: python3 scripts/apply_rater_fit_photo_v4.py
      - name: Validate JavaScript
        run: |
          node --check data/hcm-rater-content-v2.js
          node --check data/travel-companion-v1-shell.js
      - name: Validate rater contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('data/hcm-rater-content-v2.js').read_text()
          c=Path('data/rater-cinematic-v2.css').read_text()
          i=Path('index.html').read_text()
          assert 'Jade_Emperor_Pagoda_Saigon.jpg/960px-Jade_Emperor_Pagoda_Saigon.jpg' in h
          assert 'MutationObserver' in h and 'window.scrollTo(0,0)' in h
          assert 'height:150px!important' in c
          assert 'clamp(38px,10.2vw,46px)' in c
          assert 'display:block!important;visibility:visible!important;opacity:1!important;color:#e0734b!important' in c
          assert 'rater-v4' in i
          shell=Path('data/travel-companion-v1-shell.js').read_text()
          assert 'function experienceList(id,i,filter)' in shell
          assert 'function passportView(id,i,type)' in shell
          assert "state.here=id+':'+i" in shell and shell.count("state.here=id+':'+i")==1
          print('RATER V4 CONTRACT PASS')
          PY
      - name: Commit V4 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hcm-rater-content-v2.js data/rater-cinematic-v2.css index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fit Saigon rater to approved mobile scale and restore photo"
            git push origin HEAD:rater-fit-and-photo-v4
          fi

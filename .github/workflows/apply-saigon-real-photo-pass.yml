name: Apply Saigon real photo pass
on:
  push:
    branches: [saigon-real-photo-pass]
    paths:
      - 'scripts/apply_saigon_real_photo_pass.py'
      - '.github/workflows/apply-saigon-real-photo-pass.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saigon-real-photo-pass
          fetch-depth: 0
      - name: Apply curated real-photo mapping
        run: python3 scripts/apply_saigon_real_photo_pass.py
      - name: Validate HCMC photo contract
        run: |
          node --check data/hcm-rater-content-v2.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('data/hcm-rater-content-v2.js').read_text()
          c=Path('data/rater-cinematic-v2.css').read_text()
          idx=Path('index.html').read_text()
          credits=Path('docs/SAIGON_EXPERIENCE_PHOTO_SOURCES.md').read_text()
          urls=re.findall(r"photo:'(https://commons\.wikimedia\.org/wiki/Special:Redirect/file/[^']+)'",h)
          assert len(urls)==21, f'expected 21 real-photo URLs, got {len(urls)}'
          assert "photo:'assets/ai/hcm/" not in h
          assert 'AI VISUAL' not in c
          assert '20260911-real-hcm-v1' in idx
          assert credits.count('**') >= 42
          assert 'contextual' in credits.lower()
          print('SAIGON REAL PHOTO CONTRACT PASS')
          PY
      - name: Validate Wikimedia image responses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request
          h=Path('data/hcm-rater-content-v2.js').read_text()
          urls=re.findall(r"photo:'(https://commons\.wikimedia\.org/wiki/Special:Redirect/file/[^']+)'",h)
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','TravelCompanion-photo-audit/1.0')]
          failures=[]
          for n,u in enumerate(urls,1):
              try:
                  req=urllib.request.Request(u, method='HEAD')
                  with opener.open(req, timeout=25) as r:
                      ct=r.headers.get('Content-Type','')
                      if not ct.startswith('image/'):
                          failures.append((n,ct,r.geturl()))
              except Exception as e:
                  failures.append((n,str(e),u))
          if failures:
              raise SystemExit('Image validation failures: '+repr(failures))
          print('21/21 Wikimedia photo URLs resolve to images')
          PY
      - name: Commit staging photo pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/hcm-rater-content-v2.js data/rater-cinematic-v2.css index.html docs/SAIGON_EXPERIENCE_PHOTO_SOURCES.md assets/ai/hcm
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Replace Saigon AI images with curated real photography'
            git push origin HEAD:saigon-real-photo-pass
          fi

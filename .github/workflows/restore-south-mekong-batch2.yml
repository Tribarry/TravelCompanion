name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand VINHLONG_LOCAL
        run: |
          python3 -c "
from pathlib import Path
p=Path('data/vietnam-photo-alignment-v026.js');s=p.read_text()
old=\"const VINHLONG_LOCAL=[\\n [/canal|vinh long/i,'assets/images/vinh-long/01-canal.jpg']\\n];\"
new=\"const VINHLONG_LOCAL=[\\n [/mang thit|brick.?kiln|kiln country|boat kiln|enter old kiln|golden.?hour kiln/i,'assets/images/vinh-long/03-kiln.jpg'],\\n [/cu lao may|rice.?paper|banh trang/i,'assets/images/vinh-long/04-rice-paper.jpg'],\\n [/canal boat|ferry hop|homestay|river.?island|an binh|get lost|cycling/i,'assets/images/vinh-long/01-canal.jpg'],\\n [/tra on|floating/i,'assets/images/vinh-long/02-tra-on-floating.jpg'],\\n [/canal|vinh long|pottery|tofu|weaving|hyacinth|farmer|cook dinner|don ca|oil.?lamp/i,'assets/images/vinh-long/01-canal.jpg']\\n];\"
if old in s:
 s=s.replace(old,new,1); print('replaced')
else:
 print('old not found');
 import re
 s2=re.sub(r'const VINHLONG_LOCAL=\\[[\\s\\S]*?\\];', new, s, count=1)
 if s2!=s: s=s2; print('regex ok')
 else: print('FAIL')
p.write_text(s)
"
          node --check data/vietnam-photo-alignment-v026.js
          grep -A8 'const VINHLONG_LOCAL' data/vietnam-photo-alignment-v026.js
          sed -i 's/vietnam-photo-alignment-v026.js?v=[^"]*/vietnam-photo-alignment-v026.js?v=20260922-vl2/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(vinh-long): map kiln/rice-paper/canal experiences to local photos'
          git push origin HEAD:main

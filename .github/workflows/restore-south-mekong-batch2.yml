name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Exact replace VINHLONG
        run: |
          echo  | base64 -d > /tmp/e.py
          python3 /tmp/e.py
          node --check data/vietnam-photo-alignment-v026.js
          grep -A8 VINHLONG_LOCAL data/vietnam-photo-alignment-v026.js
          sed -i 's/vietnam-photo-alignment-v026.js?v=[^"]*/vietnam-photo-alignment-v026.js?v=20260922-vl3/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html
          git commit -m 'fix(vinh-long): expand experience photo mappings to kiln and rice-paper'
          git push origin HEAD:main

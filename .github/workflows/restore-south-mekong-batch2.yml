name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Redownload Nam Du compressed
        run: |
          mkdir -p assets/images/nam-du assets/images/destinations
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/namdu.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Duong_ven_nui_dao_Nam_du,_xa_An_Sơn,huyen_Kiên_Hải,_tỉnh_Kiên_Giang,_Việt_Nam,02-07-16-Dyt_-_panoramio.jpg?width=1200'
          convert /tmp/namdu.jpg -auto-orient -resize '900x1600>' -quality 70 -strip assets/images/nam-du/01-road.jpg
          cp assets/images/nam-du/01-road.jpg assets/images/destinations/nam-du.jpg
          ls -la assets/images/nam-du/01-road.jpg
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add assets/images/nam-du assets/images/destinations/nam-du.jpg
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): Nam Du compressed for lag-free local load'
          git push origin HEAD:main

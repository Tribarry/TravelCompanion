name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject missing LOCAL consts
        run: |
          python3 << 'END'
          from pathlib import Path
          p = Path('data/vietnam-photo-alignment-v026.js')
          s = p.read_text()
          block = '''
const NAMDU_LOCAL=[
 [/nam du|island|đảo|dao/i,'assets/images/nam-du/01-road.jpg']
];
const RACHGIA_LOCAL=[
 [/city|rạch giá|rach gia/i,'assets/images/rach-gia/01-city.jpg']
];
const KIENLUONG_LOCAL=[
 [/hòn chồng|hon chong|ba hòn|ba hon|kiên lương|kien luong/i,'assets/images/kien-luong/01-hon-chong.jpg']
];
const VINHLONG_LOCAL=[
 [/canal|rạch|floating|trà ôn|tra on/i,'assets/images/vinh-long/01-canal.jpg'],
 [/vĩnh long|vinh long/i,'assets/images/vinh-long/01-canal.jpg']
];
const TRAVINH_LOCAL=[
 [/pagoda|gate|trà vinh|tra vinh/i,'assets/images/tra-vinh/01-pagoda.jpg']
];

'''
          if 'const RACHGIA_LOCAL=' not in s:
              s = s.replace('const HCMC_LOCAL=[', block + 'const HCMC_LOCAL=[', 1)
          s = s.replace(
              'const add=rules=>{if(rules&&!maps.includes(rules))maps.push(rules)};',
              "const add=rules=>{if(rules&&Array.isArray(rules)&&!maps.includes(rules))maps.push(rules)};",
          )
          p.write_text(s)
          print('RACHGIA', 'const RACHGIA_LOCAL=' in s)
          print('KIEN', 'const KIENLUONG_LOCAL=' in s)
          print('NAMDU', 'const NAMDU_LOCAL=' in s)
          END
          node --check data/vietnam-photo-alignment-v026.js
          echo SYNTAX_OK
          python3 -c "import re;from pathlib import Path;p=Path('index.html');s=re.sub(r'vietnam-photo-alignment-v026\\.js\\?v=[^\"]*','vietnam-photo-alignment-v026.js?v=20260921-locals2',p.read_text());p.write_text(s);print('cache')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(photos): define missing LOCAL arrays so place heroes stop crashing'
          git push origin HEAD:main

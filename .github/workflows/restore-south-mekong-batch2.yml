name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix broken syntax lines
        run: |
          sed -i 's/add(KIENLUONG_LOCAL-;/add(KIENLUONG_LOCAL);/g' data/vietnam-photo-alignment-v026.js
          sed -i 's/add(BENTRE_LOCAL-;/add(BENTRE_LOCAL);/g' data/vietnam-photo-alignment-v026.js
          sed -i 's/KIENLEONG_LOCAL/KIENLUONG_LOCAL/g' data/vietnam-photo-alignment-v026.js
          sed -i "s|return 'assets/images/tra-su/01-boat.jpg'|return 'assets/images/destinations/tra-su.jpg'|g" data/vietnam-photo-alignment-v026.js
          node --check data/vietnam-photo-alignment-v026.js
          echo "syntax OK"
          sed -i 's/vietnam-photo-alignment-v026.js?v=[^"]*/vietnam-photo-alignment-v026.js?v=20260921-placeheroes/g' index.html
          grep vietnam-photo-alignment index.html | head -1
          cp assets/images/destinations/tinh-bien-tri-ton.jpg assets/images/destinations/tinh-bien.jpg || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html assets/images/destinations/tinh-bien.jpg
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(photos): repair alignment syntax so place heroes load (not wiki logos)'
          git push origin HEAD:main

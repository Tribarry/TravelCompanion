name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Vinh Long bank + mappings
        run: |
          echo  | base64 -d > /tmp/vl.py
          python3 /tmp/vl.py
          node --check data/vietnam-photo-alignment-v026.js
          ls -la assets/images/vinh-long/
          sed -i 's/vietnam-photo-alignment-v026.js?v=[^"]*/vietnam-photo-alignment-v026.js?v=20260922-vinhlong/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add assets/images/vinh-long assets/images/destinations/vinh-long.jpg data/vietnam-photo-alignment-v026.js index.html
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(vinh-long): local kiln + rice-paper bank; map experiences off PHOTO TO VERIFY'
          git push origin HEAD:main

name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix syntax
        run: |
          echo  | base64 -d > /tmp/f.py
          python3 /tmp/f.py
          node --check data/vietnam-photo-alignment-v026.js
          echo ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQpwPVBhdGgoImluZGV4Lmh0bWwiKQpzPXAucmVhZF90ZXh0KCkKczI9cmUuc3ViKHIidmlldG5hbS1waG90by1hbGlnbm1lbnQtdjAyNlwuanNcP3Y9W15cIl0qIiwidmlldG5hbS1waG90by1hbGlnbm1lbnQtdjAyNi5qcz92PTIwMjYwOTIxLXBsYWNlaGVyb2VzIixzKQpwLndyaXRlX3RleHQoczIpCnByaW50KCJjYWNoZSIpCg== | base64 -d > /tmp/i.py
          python3 /tmp/i.py
          cp assets/images/destinations/tinh-bien-tri-ton.jpg assets/images/destinations/tinh-bien.jpg || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html assets/images/destinations/tinh-bien.jpg
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(photos): repair alignment JS syntax — place heroes were falling back to wiki logos'
          git push origin HEAD:main

name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download local banks
        run: |
          mkdir -p assets/images/rach-gia assets/images/kien-luong assets/images/vinh-long assets/images/tra-vinh assets/images/destinations
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/rg.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Rach_Gia_2018_Kenno.jpg?width=1600'
          convert /tmp/rg.jpg -resize '1280x>' -quality 82 -strip assets/images/rach-gia/01-city.jpg
          cp assets/images/rach-gia/01-city.jpg assets/images/destinations/rach-gia.jpg
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/kl.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Hòn_Chông_(50572156981).jpg?width=1600' || curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/kl.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Mount_Ba_Hòn,_Kiên_Lương_town,_Kiên_Lương_district,_Kiên_Giang,_Vietnam,_at_June-2022.jpg?width=1600'
          convert /tmp/kl.jpg -resize '1280x>' -quality 82 -strip assets/images/kien-luong/01-hon-chong.jpg
          cp assets/images/kien-luong/01-hon-chong.jpg assets/images/destinations/kien-luong.jpg
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/vl.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Rạch_Cái_Cá.jpg?width=1600'
          convert /tmp/vl.jpg -resize '1280x>' -quality 82 -strip assets/images/vinh-long/01-canal.jpg
          cp assets/images/vinh-long/01-canal.jpg assets/images/destinations/vinh-long.jpg
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/traon.jpg 'https://commons.wikimedia.org/wiki/Special:FilePath/Chợ_nổi_Trà_Ôn_(mới).jpg?width=1600'
          convert /tmp/traon.jpg -resize '1280x>' -quality 82 -strip assets/images/vinh-long/02-tra-on-floating.jpg
          cp assets/images/vinh-long/02-tra-on-floating.jpg assets/images/tra-vinh/01-river-market.jpg
          cp assets/images/tra-vinh/01-river-market.jpg assets/images/destinations/tra-vinh.jpg
          ls -la assets/images/rach-gia assets/images/kien-luong assets/images/vinh-long assets/images/tra-vinh

      - name: Compress large
        run: |
          for f in assets/images/tra-su/05-dry-season.jpg assets/images/hcmc/can-gio.jpg; do
            [ -f "$f" ] || continue
            before=$(stat -c%s "$f")
            convert "$f" -resize '1200x>' -quality 78 -strip "$f.tmp.jpg"
            mv "$f.tmp.jpg" "$f"
            echo "$f: $before -> $(stat -c%s "$f")"
          done

      - name: Wire alignment
        run: |
          echo  | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n RACHGIA_LOCAL data/vietnam-photo-alignment-v026.js | head

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add assets/images/rach-gia assets/images/kien-luong assets/images/vinh-long assets/images/tra-vinh assets/images/destinations data/vietnam-photo-alignment-v026.js assets/images/tra-su assets/images/hcmc || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): batch 5 — Rạch Giá, Kiên Lương, Vĩnh Long, Trà Vinh banks + wire + compress'
          git push origin HEAD:main

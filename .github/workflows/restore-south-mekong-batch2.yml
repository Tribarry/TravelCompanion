name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire Bến Tre into alignment
        run: |
          echo  | base64 -d > /tmp/w.py
          python3 /tmp/w.py
          grep -n BENTRE_LOCAL data/vietnam-photo-alignment-v026.js | head

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): wire Bến Tre local bank into photo alignment'
          git push origin HEAD:main

name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python fix syntax
        run: |
          python3 -c "
from pathlib import Path
p=Path('data/vietnam-photo-alignment-v026.js')
s=p.read_text()
s=s.replace('add(KIENLUONG_LOCAL-;','add(KIENLUONG_LOCAL);')
s=s.replace('add(BENTRE_LOCAL-;','add(BENTRE_LOCAL);')
s=s.replace('KIENLEONG_LOCAL','KIENLUONG_LOCAL')
s=s.replace(\"return 'assets/images/tra-su/01-boat.jpg'\",\"return 'assets/images/destinations/tra-su.jpg'\")
p.write_text(s)
print('fixed', s.count('KIENLUONG_LOCAL-;'), s.count('BENTRE_LOCAL-;'), 'KIENLEONG' in s)
"
          node --check data/vietnam-photo-alignment-v026.js
          echo SYNTAX_OK
          python3 -c "
from pathlib import Path
p=Path('index.html')
s=p.read_text()
import re
s2=re.sub(r'vietnam-photo-alignment-v026\\.js\\?v=[^\"]*','vietnam-photo-alignment-v026.js?v=20260921-placeheroes',s)
p.write_text(s2)
print('cache busted')
"
          cp assets/images/destinations/tinh-bien-tri-ton.jpg assets/images/destinations/tinh-bien.jpg || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html assets/images/destinations/tinh-bien.jpg
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(photos): repair alignment JS syntax — place heroes were falling back to wiki logos'
          git push origin HEAD:main

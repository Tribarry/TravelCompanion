name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject missing LOCAL consts via python one-liner file
        run: |
          python3 -c 'from pathlib import Path;p=Path("data/vietnam-photo-alignment-v026.js");s=p.read_text();
block="""\nconst NAMDU_LOCAL=[\n [/nam du|island/i,"assets/images/nam-du/01-road.jpg"]\n];\nconst RACHGIA_LOCAL=[\n [/city|rach gia/i,"assets/images/rach-gia/01-city.jpg"]\n];\nconst KIENLUONG_LOCAL=[\n [/hon chong|kien luong/i,"assets/images/kien-luong/01-hon-chong.jpg"]\n];\nconst VINHLONG_LOCAL=[\n [/canal|vinh long/i,"assets/images/vinh-long/01-canal.jpg"]\n];\nconst TRAVINH_LOCAL=[\n [/pagoda|tra vinh/i,"assets/images/tra-vinh/01-pagoda.jpg"]\n];\n\n""";

if "const RACHGIA_LOCAL=" not in s: s=s.replace("const HCMC_LOCAL=[",block+"const HCMC_LOCAL=[",1);
s=s.replace("const add=rules=>{if(rules&&!maps.includes(rules))maps.push(rules)};","const add=rules=>{if(rules&&typeof rules!==\"undefined\"&&rules&&!maps.includes(rules))maps.push(rules)};");
p.write_text(s);print("ok", "const RACHGIA_LOCAL=" in s)'
          node --check data/vietnam-photo-alignment-v026.js
          echo SYNTAX_OK
          sed -i 's/vietnam-photo-alignment-v026.js?v=[^"]*/vietnam-photo-alignment-v026.js?v=20260921-locals2/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add data/vietnam-photo-alignment-v026.js index.html
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(photos): define missing LOCAL arrays so place heroes stop crashing'
          git push origin HEAD:main

name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Tà Pạ mountain + lake
        run: |
          mkdir -p assets/images/tinh-bien
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/ta-pa-mt.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Núi_tà_pạ,_tri_tôn_,_angiang,_vietnam_-_panoramio.jpg?width=1600'
          convert /tmp/ta-pa-mt.jpg -resize '1280x>' -quality 82 -strip assets/images/tinh-bien/06-chua-ta-pa.jpg
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/ta-pa-lake.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Hotapa.jpg?width=1600'
          convert /tmp/ta-pa-lake.jpg -resize '1280x>' -quality 82 -strip assets/images/tinh-bien/07-quarry-lake.jpg
          ls -la assets/images/tinh-bien/06-chua-ta-pa.jpg assets/images/tinh-bien/07-quarry-lake.jpg

      - name: Bến Tre bank
        run: |
          mkdir -p assets/images/ben-tre assets/images/destinations
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/ben-tre-mkt.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Ben_Tre_Market,_southern_side.jpg?width=1600'
          convert /tmp/ben-tre-mkt.jpg -resize '1280x>' -quality 82 -strip assets/images/ben-tre/01-market.jpg
          cp assets/images/ben-tre/01-market.jpg assets/images/destinations/ben-tre.jpg
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' -o /tmp/ben-tre-river.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Ben_Tre_River.jpg?width=1600' || true
          if [ -f /tmp/ben-tre-river.jpg ]; then
            convert /tmp/ben-tre-river.jpg -resize '1280x>' -quality 82 -strip assets/images/ben-tre/02-river.jpg
          fi
          ls -la assets/images/ben-tre/

      - name: Compress large locals
        run: |
          for f in assets/images/hcmc/can-gio.jpg assets/images/tra-su/05-dry-season.jpg assets/images/cai-be/08-cooking.jpg; do
            if [ -f "$f" ]; then
              before=$(stat -c%s "$f")
              convert "$f" -resize '1280x>' -quality 80 -strip "$f.tmp.jpg"
              mv "$f.tmp.jpg" "$f"
              after=$(stat -c%s "$f")
              echo "$f: $before -> $after"
            fi
          done

      - name: Write image-sources credits
        run: |
          mkdir -p data
          python3 -c "import json; open('data/image-sources-south-mekong.json','w').write(json.dumps({'updated':'2026-09-19','policy':'verification-first local-only','note':'See commit message and Commons file pages for full attribution of restored South/Mekong photos'}, indent=2))"

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add assets/images/tinh-bien assets/images/ben-tre assets/images/destinations/ben-tre.jpg \
            assets/images/hcmc/can-gio.jpg assets/images/tra-su/05-dry-season.jpg assets/images/cai-be/08-cooking.jpg \
            data/image-sources-south-mekong.json || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git status --short
          git commit -m 'fix(south-mekong): batch 4 — Tà Pạ, Bến Tre bank, compress, image-sources'
          git push origin HEAD:main

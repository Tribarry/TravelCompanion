name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Heroes from existing exact local files
        run: |
          mkdir -p assets/images/destinations
          # Sa Đéc hero = elevated flower nurseries (exact subject)
          convert assets/images/sa-dec/01-nurseries.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/destinations/sa-dec.jpg
          # Cái Bè hero = church on the Tiền (exact place)
          convert assets/images/cai-be/10-church.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/destinations/cai-be.jpg
          ls -la assets/images/destinations/sa-dec.jpg assets/images/destinations/cai-be.jpg

      - name: Châu Đốc hero = Bà Chúa Xứ temple (Commons)
        run: |
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' \
            -o /tmp/ba-chua.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Miếu_Bà_Chúa_Xứ_(12816644963).jpg?width=1600'
          convert /tmp/ba-chua.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/destinations/chau-doc.jpg
          # also refresh experience slot if oversized
          convert /tmp/ba-chua.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/chau-doc/01-ba-chua-xu.jpg
          ls -la assets/images/destinations/chau-doc.jpg assets/images/chau-doc/01-ba-chua-xu.jpg
          file assets/images/destinations/chau-doc.jpg

      - name: Cần Thơ Cái Răng floating market (Commons)
        run: |
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' \
            -o /tmp/cai-rang.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Một_cảnh_ở_chợ_nổi_Cái_Răng.jpg?width=1600'
          convert /tmp/cai-rang.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/can-tho/01-cai-rang.jpg
          ls -la assets/images/can-tho/01-cai-rang.jpg
          file assets/images/can-tho/01-cai-rang.jpg

      - name: Bạc Liêu Xiêm Cán pagoda (Commons CC BY-SA)
        run: |
          curl -fsSL -A 'TravelCompanionPhotoFix/1.0' \
            -o /tmp/xiem-can.jpg \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Chùa_Xiêm_Cán_Bạc_Liêu.jpg?width=1600'
          convert /tmp/xiem-can.jpg -resize '1280x>' -quality 82 -strip \
            assets/images/bac-lieu/04-xiem-can.jpg
          ls -la assets/images/bac-lieu/04-xiem-can.jpg
          file assets/images/bac-lieu/04-xiem-can.jpg

      - name: Trà Sư dry-season interim (use open boardwalk / less flooded look)
        run: |
          # Prefer a less flooded frame from existing local set as interim dry-season
          # until a verified dry-season Commons shot is sourced
          if [ -f assets/images/tra-su/06-boardwalk.jpg ]; then
            convert assets/images/tra-su/06-boardwalk.jpg -resize '1280x>' -quality 82 -strip \
              assets/images/tra-su/05-dry-season.jpg
          fi
          ls -la assets/images/tra-su/05-dry-season.jpg || true

      - name: Compress remaining oversized locals in batch
        run: |
          for f in \
            assets/images/tra-su/06-boardwalk.jpg \
            assets/images/chau-doc/01-ba-chua-xu.jpg
          do
            if [ -f "$f" ]; then
              convert "$f" -resize '1280x>' -quality 82 -strip "$f"
              ls -la "$f"
            fi
          done

      - name: Commit all restored photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/images/destinations/sa-dec.jpg \
            assets/images/destinations/cai-be.jpg \
            assets/images/destinations/chau-doc.jpg \
            assets/images/chau-doc/01-ba-chua-xu.jpg \
            assets/images/can-tho/01-cai-rang.jpg \
            assets/images/bac-lieu/04-xiem-can.jpg \
            assets/images/tra-su/05-dry-season.jpg \
            assets/images/tra-su/06-boardwalk.jpg || true
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git status --short
          git commit -m 'fix(south-mekong): restore destination heroes + Cái Răng + Xiêm Cán; compress oversize'
          git push origin HEAD:main

name: Restore South Mekong batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Compress Nam Du hard
        run: |
          convert assets/images/nam-du/01-road.jpg -auto-orient -resize '900x>' -quality 72 -strip assets/images/nam-du/01-road.jpg
          cp assets/images/nam-du/01-road.jpg assets/images/destinations/nam-du.jpg
          ls -la assets/images/nam-du/01-road.jpg
      - name: Ensure NAMDU_LOCAL const exists
        run: |
          echo  | base64 -d > /tmp/n.py
          python3 /tmp/n.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || git pull origin main
          git add assets/images/nam-du assets/images/destinations/nam-du.jpg data/vietnam-photo-alignment-v026.js
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m 'fix(south-mekong): Nam Du ~250KB + NAMDU_LOCAL const'
          git push origin HEAD:main

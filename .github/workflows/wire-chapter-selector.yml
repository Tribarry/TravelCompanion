name: Publish Choose Your Chapter selector
on:
  push:
    paths:
      - '.github/workflows/wire-chapter-selector.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire chapter selector into live app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="data/chapter-selector-v022.js?v=20260910"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit live selector
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish full-screen Choose Your Chapter carousel"
          git push
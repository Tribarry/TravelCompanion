name: Publish Choose Your Chapter selector
on:
  push:
    paths:
      - '.github/workflows/wire-chapter-selector.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kazakhstan chapter image and republish selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          chapter=Path('data/chapter-selector-v022.js')
          s=chapter.read_text()
          old="kazakhstan:{n:'05',flag:'🇰🇿',name:'KAZAKHSTAN',meta:'JULY · CENTRAL ASIA',facts:['ALMATY','KOLSAI LAKES','KAINDY LAKE','CHARYN CANYON'],image:'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1800&q=90'}"
          new="kazakhstan:{n:'05',flag:'🇰🇿',name:'KAZAKHSTAN',meta:'JULY · CENTRAL ASIA',facts:['ALMATY','KOLSAI LAKES','KAINDY LAKE','CHARYN CANYON'],image:'https://putidorogi-nn.ru/images/stories/aziya/kazahstan/kazahstan_2.jpg'}"
          if old not in s:
              raise SystemExit('Kazakhstan selector record not found')
          chapter.write_text(s.replace(old,new,1))

          p=Path('index.html')
          h=p.read_text()
          h=re.sub(r'\s*<script src="data/chapter-selector-v022\.js\?v=[^"]+"></script>', '', h)
          tag='<script src="data/chapter-selector-v022.js?v=20260910-1745"></script>'
          p.write_text(h.replace('</body></html>', tag+'\n</body></html>'))
          PY
      - name: Commit selector image fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chapter-selector-v022.js index.html
          git commit -m "Use distinct Charyn Canyon image for Kazakhstan chapter"
          git push